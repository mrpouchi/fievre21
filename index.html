<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Fièvre 21</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Pixelify+Sans:wght@400;600;700&family=VT323&display=swap">
<style>
/* Écran d'arcade psyché : fond tourbillon pixel, panneaux sombres, Jetons bleus × Mult rouge */
:root {
  --bg: #0b0418; --ink: #f6efff; --dim: #a596c9;
  --panel: rgba(13, 5, 29, .86); --panel2: rgba(30, 14, 60, .92); --edge: #6d45e8;
  --chips: #33c4ff; --chips-d: #0a6b99; --mult: #ff3b6b; --mult-d: #99133a;
  --gold: #ffd23f; --gold-d: #9c7400; --green: #3ef08a; --green-d: #138a46;
  --boss: #ff2d4a; --purple: #b56cff; --purple-d: #5b2aa8; --cyan: #5ff0ff;
  --grey: #5d5578; --grey-d: #2f2a44;
  --r-c: #5fd0ff; --r-u: #46f08c; --r-r: #ff5ad9; --r-l: #ffd23f;
  --paper: #fbf3df; --paper-ink: #1d1530; --red-suit: #e0213f;
  --f-text: 'Pixelify Sans', ui-monospace, 'Courier New', monospace;
  --f-num: 'VT323', ui-monospace, 'Courier New', monospace;
  --f-card: 'Oswald', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --cwb: 60px; --cw: var(--cwb);
  --sp: 1;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); overflow: hidden; font-family: var(--f-text); font-size: 15px;
  -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
button { font-family: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
#bg { position: fixed; inset: 0; transform: translateZ(0); will-change: transform; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; z-index: 0; }
#crt { position: fixed; inset: 0; pointer-events: none; z-index: 95; transform: translateZ(0); will-change: transform; contain: strict; background: repeating-linear-gradient(to bottom, rgba(0,0,0,.2) 0 1px, transparent 1px 3px); }
#crt::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.5) 85%, rgba(0,0,0,.88) 100%); }
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 85; overflow: hidden; contain: strict; }
#flash { position: fixed; inset: 0; pointer-events: none; z-index: 84; will-change: opacity; contain: strict; background: var(--mult); opacity: 0; }
#flash.on { animation: flash .25s ease-out; }
@keyframes flash { 0% { opacity: .28; } 100% { opacity: 0; } }
#toasts { position: fixed; left: 50%; top: calc(8px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 88; display: grid; gap: 6px; width: min(420px, calc(100% - 32px)); pointer-events: none; }
.toast { background: rgba(20, 8, 44, .95); border: 2px solid var(--purple); padding: 6px 10px; font-size: 14px; text-align: center; animation: toast 2.4s ease-out forwards; box-shadow: 0 0 0 2px #000; }
.toast.money { border-color: var(--gold); color: var(--gold); } .toast.tag { border-color: var(--cyan); color: var(--cyan); } .toast.charm { border-color: var(--r-r); } .toast.create { border-color: var(--purple); color: #e3c7ff; } .toast.level { border-color: var(--gold); }
@keyframes toast { 0% { transform: translateY(-20px); opacity: 0; } 8%, 85% { transform: none; opacity: 1; } 100% { transform: translateY(-10px); opacity: 0; } }

#app { position: relative; z-index: 1; height: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#app.shake { animation: shake .45s cubic-bezier(.36,.07,.19,.97) 1; }
@keyframes shake { 0%{transform:translate(0,0)} 20%{transform:translate(-7px,3px)} 40%{transform:translate(6px,-4px)} 60%{transform:translate(-5px,2px)} 80%{transform:translate(4px,-2px)} 100%{transform:translate(0,0)} }
.screen { display: none; flex: 1; min-height: 0; flex-direction: column; }
.screen.on { display: flex; animation: wipe .32s cubic-bezier(.2,.8,.3,1) both; }
@keyframes wipe { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }

.px { background: var(--panel); border: 2px solid var(--edge); box-shadow: 0 0 0 2px #000, inset 0 0 0 2px rgba(255,255,255,.04);
  clip-path: polygon(4px 0, calc(100% - 4px) 0, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 0 calc(100% - 4px), 0 4px); }
.btn { --c: var(--grey); --d: var(--grey-d); border: 0; background: var(--c); color: #fff; font-weight: 700; letter-spacing: .04em; font-size: 18px; min-height: 50px; padding: 6px 10px; position: relative;
  box-shadow: inset 0 -5px 0 var(--d), inset 0 2px 0 rgba(255,255,255,.35), 0 0 0 2px #000;
  clip-path: polygon(3px 0, calc(100% - 3px) 0, 100% 3px, 100% calc(100% - 3px), calc(100% - 3px) 100%, 3px 100%, 0 calc(100% - 3px), 0 3px);
  text-shadow: 2px 2px 0 rgba(0,0,0,.45); transition: transform .06s, filter .1s; }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: inset 0 -2px 0 var(--d), 0 0 0 2px #000; }
.btn:disabled { filter: grayscale(.85) brightness(.55); cursor: default; }
.btn small { display: block; font-size: 12px; font-weight: 400; opacity: .9; letter-spacing: 0; }
.b-blue { --c: #1f8fe0; --d: var(--chips-d); } .b-gold { --c: #e9a800; --d: var(--gold-d); color: #241500; text-shadow: 1px 1px 0 rgba(255,255,255,.35); }
.b-green { --c: #1fbf63; --d: var(--green-d); } .b-red { --c: #e2234b; --d: var(--mult-d); } .b-purple { --c: #8a4be6; --d: var(--purple-d); } .b-grey { --c: #4a4366; --d: #262138; }
.b-cyan { --c: #17a9b8; --d: #0b5c66; }
.mini { min-height: 34px; font-size: 13px; padding: 2px 8px; }

/* ---------- Titre ---------- */
#title { justify-content: center; align-items: center; gap: 16px; text-align: center; padding-block: 20px; overflow-y: auto; }
.logo { font-weight: 700; line-height: .9; margin: 0; font-size: clamp(54px, 19vw, 88px); letter-spacing: .02em; color: var(--ink);
  text-shadow: 4px 0 0 var(--mult), -4px 0 0 var(--chips), 0 6px 0 #000; animation: glitch 3.2s steps(1) infinite; }
.logo span { display: block; font-family: var(--f-num); font-size: 1.5em; color: var(--gold); text-shadow: 4px 4px 0 var(--mult-d), 0 0 24px rgba(255,210,63,.5); }
@keyframes glitch { 0%,92%,100%{transform:none} 93%{transform:translate(3px,-1px) skewX(-6deg)} 95%{transform:translate(-3px,1px)} 97%{transform:translate(1px,0) skewX(4deg)} }
.tagline { color: var(--dim); margin: 0; font-size: 15px; max-width: 30ch; }
.title-cards { display: flex; gap: 6px; justify-content: center; height: 96px; align-items: center; }
.title-cards .card { --cw: 58px; }
.title-cards .card:nth-child(1) { --rot: -12deg; } .title-cards .card:nth-child(3) { --rot: 10deg; }
.menu { display: grid; gap: 9px; width: min(300px, 100%); }
.record { font-family: var(--f-num); font-size: 20px; color: var(--gold); }

/* ---------- Choix du paquet ---------- */
#setup { justify-content: center; gap: 12px; padding-block: 16px; overflow-y: auto; }
#setup h2 { margin: 0; text-align: center; font-size: 24px; }
.deckpick { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 12px; }
.deckcard { display: grid; justify-items: center; gap: 8px; text-align: center; min-height: 190px; align-content: center; }
.deckart { width: 84px; height: 118px; position: relative; box-shadow: 0 0 0 2px #000, 4px 5px 0 rgba(0,0,0,.5); animation: bob 3s ease-in-out infinite; }
.deckart::before { content: ""; position: absolute; inset: 0; background: repeating-conic-gradient(from 45deg, var(--a) 0 25%, var(--b) 0 50%) 0 0 / 12px 12px; }
.deckart::after { content: ""; position: absolute; inset: 7px; border: 2px solid var(--c, #fff); }
.deckart.locked { filter: grayscale(1) brightness(.4); }
.deckname { font-size: 20px; font-weight: 700; }
.deckdesc { font-size: 14px; color: var(--dim); max-width: 30ch; min-height: 38px; }
.stakes { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; }
.stake { aspect-ratio: 1; border-radius: 50%; border: 3px dashed rgba(0,0,0,.45); background: var(--sc); box-shadow: 0 0 0 2px #000; padding: 0; }
.stake.sel { outline: 3px solid #fff; outline-offset: 2px; }
.stake:disabled { filter: grayscale(1) brightness(.35); }
.stakeinfo { text-align: center; font-size: 13px; color: var(--dim); min-height: 34px; }

/* ---------- Sélection de table ---------- */
#select { gap: 8px; padding-block: 8px; overflow-y: auto; }
.selhead { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; }
.selhead h2 { margin: 0; font-size: 22px; }
.money { font-family: var(--f-num); font-size: 32px; color: var(--gold); line-height: 1; }
.blinds { display: grid; gap: 8px; }
.blind { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px; animation: rise .4s cubic-bezier(.2,.8,.3,1) both; animation-delay: calc(var(--i) * .08s); }
@keyframes rise { from { transform: translateY(20px); opacity: 0; } }
.blind.done, .blind.skipped { opacity: .45; }
.blind.upcoming { opacity: .8; }
.blind.current { border-color: var(--gold); }
.blind.boss { border-color: var(--boss); background: rgba(45, 4, 14, .88); }
.chip { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-num); font-size: 26px; color: #fff;
  background: var(--cc, #1f8fe0); border: 5px dashed rgba(255,255,255,.7); box-shadow: 0 0 0 3px #000, inset 0 0 0 3px rgba(0,0,0,.3); text-shadow: 2px 2px 0 #000; animation: spin 8s linear infinite; }
@keyframes spin { to { rotate: 360deg; } }
.blind .bname { font-weight: 700; font-size: 17px; }
.blind .brule { font-size: 13px; color: #ffb3c0; }
.blind .binfo { font-size: 13px; color: var(--dim); }
.blind .binfo b { font-family: var(--f-num); font-size: 20px; color: var(--gold); font-weight: 400; }
.blind .bact { display: grid; gap: 6px; min-width: 104px; }
.tagpill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--cyan); }
.tagicon { width: 24px; height: 24px; display: grid; place-items: center; background: #062a33; border: 2px solid var(--cyan); }
.tagicon svg { width: 16px; height: 16px; color: var(--cyan); }
.owned-tags { display: flex; gap: 4px; flex-wrap: wrap; }

/* ---------- Jeu ---------- */
#game { gap: 5px; padding-block: 6px; }
#hdr { padding: 5px 10px; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; }
#hdr.boss { border-color: var(--boss); background: rgba(50, 4, 14, .88); }
#tName { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#hdr.boss #tName { color: #ff8095; }
#tRule { grid-column: 1 / -1; font-size: 12px; color: #ffb3c0; margin-top: -2px; }
#tGoal { font-family: var(--f-num); font-size: 22px; color: var(--gold); text-align: right; line-height: 1; }
#tGoal small { font-family: var(--f-text); font-size: 10px; color: var(--dim); display: block; }
.bar { grid-column: 1 / -1; height: 9px; background: #000; border: 2px solid #2d1f55; position: relative; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; width: 0; background: repeating-linear-gradient(90deg, var(--gold) 0 6px, #ffb000 6px 8px); transition: width .6s cubic-bezier(.2,.9,.3,1.2); }
#hdr.boss .bar i { background: repeating-linear-gradient(90deg, #ff5470 0 6px, #c4002a 6px 8px); }
#stats { display: grid; grid-template-columns: 1.6fr 1fr 1fr 1.1fr 1fr; gap: 5px; }
.stat { padding: 2px 4px 1px; text-align: center; min-width: 0; }
.stat b { display: block; font-size: 10px; color: var(--dim); font-weight: 400; letter-spacing: .06em; text-transform: uppercase; }
.stat span { font-family: var(--f-num); font-size: 24px; line-height: .95; display: block; font-variant-numeric: tabular-nums; white-space: nowrap; }
#sScore span, #sMoney span { color: var(--gold); }
.stat.bump span { animation: bump .35s; }
@keyframes bump { 40% { transform: scale(1.35); } }
#charmsRow { height: 54px; }
.slots { display: grid; grid-template-columns: repeat(var(--n, 5), 1fr); gap: 5px; height: 100%; }
.slot { position: relative; border: 2px dashed #3d2d70; background: rgba(10,4,22,.6); display: grid; place-items: center; padding: 0; min-width: 0; }
.slot.full { border: 2px solid var(--rc, var(--r-c)); background: rgba(16,6,36,.92); box-shadow: inset 0 0 12px color-mix(in srgb, var(--rc) 35%, transparent); animation: bob 3s ease-in-out infinite; animation-delay: calc(var(--i) * -.6s); }
.slot svg { width: 30px; height: 30px; } .slot svg.coin { width: 42px; height: 42px; }
/* Icônes vectorielles : légère ombre portée pour les détacher des panneaux sombres */
svg.ico, .slot > svg, .cslot > svg, .sh-icon > svg, .colitem svg, .tagicon svg { filter: drop-shadow(0 2px 0 rgba(0,0,0,.6)); overflow: visible; }
.slot .price { position: absolute; bottom: 0; left: 0; right: 0; font-family: var(--f-num); font-size: 14px; line-height: 1; color: var(--gold); background: rgba(0,0,0,.6); }
.slot.trig { animation: wobble .38s cubic-bezier(.3,1.4,.5,1) 1; }
/* Porte-bonheur sur jeton : il remplit l'emplacement, et tourne comme une pièce quand il se déclenche */
.slot svg.coin { filter: drop-shadow(0 2px 2px rgba(0,0,0,.5)); }
svg.coin.pix image { image-rendering: pixelated; image-rendering: crisp-edges; }
.slot:has(.price) svg.coin { margin-bottom: 9px; }
.slot.trig > svg.coin { animation: chipflip .45s ease-out; }
@keyframes chipflip { from { transform: rotateY(0); } to { transform: rotateY(360deg); } }
.sh-icon svg.coin { width: 54px; height: 54px; } .colitem svg.coin { width: 38px; height: 38px; }
#tip .sh-icon svg.coin { width: 40px; height: 40px; }
.sh-icon:has(svg.coin) { border-radius: 50%; border-color: transparent; background: none; }
@keyframes wobble { 0%{transform:rotate(0) scale(1)} 30%{transform:rotate(-12deg) scale(1.22)} 60%{transform:rotate(10deg) scale(1.22)} 100%{transform:rotate(0) scale(1)} }
.slot.off::after, .slot.dead::after { content: "✕"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--mult); font-size: 30px; background: rgba(0,0,0,.55); }
.slot.dead { filter: grayscale(1); }
.slot.hiddenc svg { visibility: hidden; }
.slot.hiddenc { background: repeating-conic-gradient(from 45deg, #2a0f5c 0 25%, #4b1d9e 0 50%) 0 0 / 10px 10px; }
.stk { position: absolute; top: -2px; left: -2px; font-family: var(--f-num); font-size: 12px; line-height: 1; padding: 0 2px; background: #000; color: #fff; }
.stk.e { color: #c9c9ff; } .stk.p { color: #ffb36b; left: auto; right: -2px; } .stk.r { color: var(--gold); top: auto; bottom: -2px; }
.r-c { --rc: var(--r-c); } .r-u { --rc: var(--r-u); } .r-r { --rc: var(--r-r); } .r-l { --rc: var(--r-l); }
#consRow { display: grid; grid-template-columns: 1fr auto auto; gap: 5px; height: 38px; }
.cons { display: flex; gap: 5px; }
.cslot { width: 38px; height: 38px; border: 2px dashed #3d2d70; background: rgba(10,4,22,.6); display: grid; place-items: center; padding: 0; position: relative; }
.cslot.full { border-style: solid; }
.cslot svg { width: 24px; height: 24px; }
.cslot.k-arcane { border-color: var(--purple); background: rgba(40, 10, 70, .9); } .cslot.k-arcane svg { color: #d6a8ff; }
.cslot.k-etoile { border-color: var(--gold); background: rgba(50, 36, 6, .9); } .cslot.k-etoile svg { color: var(--gold); }
.cslot.k-spectre { border-color: var(--cyan); background: rgba(6, 40, 50, .9); } .cslot.k-spectre svg { color: var(--cyan); }
.zone { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 2px; position: relative; }
.zlabel { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--dim); padding: 0 2px; }
.zlabel .tot { font-family: var(--f-num); font-size: 24px; color: var(--ink); line-height: 1; }
.tot.bust { color: var(--mult); } .tot.bj { color: var(--gold); }
.hands { display: flex; gap: 6px; justify-content: center; }
.hand { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; padding: 3px 2px; border: 2px solid transparent; }
.hands.split .hand { --cw: calc(var(--cwb) * .74); }
.hands.split3 .hand { --cw: calc(var(--cwb) * .56); }
.hands.split .hand.active { border-color: var(--gold); background: rgba(255,210,63,.07); }
.hands.split .hand.scoring { border-color: var(--chips); }
.hand .htot { text-align: center; }
.htype { text-align: center; font-size: 11px; color: var(--cyan); height: 13px; white-space: nowrap; overflow: hidden; }
.row { display: flex; justify-content: center; align-items: flex-end; height: calc(var(--cw) * 1.4 + 10px); padding-top: 4px; }
.row > .card + .card { margin-left: var(--ov, 6px); }
.peek { position: absolute; right: 0; top: 0; display: flex; align-items: center; gap: 3px; font-size: 11px; color: var(--purple); z-index: 3; }
.peek .card { --cw: 24px; animation: none; }
.peek .card .cc, .peek .card .br, .peek .card .etag, .peek .card .seal { display: none; }
.peek .card .ci { inset: 0; width: auto; justify-content: center; gap: 1px; font-size: 11px; }
.peek .card .ci svg { width: 8px; height: 8px; margin: 0; }

/* ---------- Cartes (vectorielles : enseignes <symbol>, repère 100 × 140) ---------- */
.card { --i: 0; --rot: 0deg; --ty: 0px; --c-edge: 0 0 0 1.5px #140b26; --c-drop: 2px 3px 0 rgba(0,0,0,.42); --c-rad: calc(var(--cw) * .085);
  width: var(--cw); height: calc(var(--cw) * 1.4); flex: none; position: relative; border-radius: var(--c-rad); color: var(--paper-ink); font-family: var(--f-card);
  rotate: var(--rot); translate: 0 var(--ty); animation: bob 3.4s ease-in-out infinite; animation-delay: calc(var(--i) * -.55s); }
@keyframes bob { 0%,100% { translate: 0 var(--ty, 0px); } 50% { translate: 0 calc(var(--ty, 0px) - 3px); } }
.card .cface, .card .cback { position: absolute; inset: 0; border-radius: var(--c-rad); overflow: hidden; background: linear-gradient(165deg, #fffaf0, var(--paper) 55%, #f3e6c8);
  box-shadow: var(--c-edge), inset 0 0 0 1px rgba(255,255,255,.9), inset 0 -2px 0 rgba(60,40,0,.1), var(--c-drop); }
.card.red { color: var(--red-suit); }
.card .ci { position: absolute; width: 22%; display: flex; flex-direction: column; align-items: center; font-weight: 700; line-height: .86; font-size: calc(var(--cw) * .27); z-index: 1; }
.card .ci b { font-weight: 700; }
.card .ci.ten b { font-size: .84em; letter-spacing: -.06em; margin-left: -.06em; }
.card .ci svg { width: calc(var(--cw) * .15); height: calc(var(--cw) * .15); margin-top: calc(var(--cw) * .025); }
.card .tl { left: 2%; top: 3%; } .card .br { right: 2%; bottom: 3%; transform: rotate(180deg); }
.card .cc { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; z-index: 1; }
.card .cc .ring { fill: none; stroke: currentColor; stroke-opacity: .2; stroke-width: 1.2; }
.card.face .cface { background: linear-gradient(165deg, #fff8e4, #f7ebcb 55%, #ecd9a8); }
.card .cc .fp { fill: currentColor; fill-opacity: .07; stroke: currentColor; stroke-width: 1.6; }
.card .cc .fi { fill: none; stroke: #c9971c; stroke-width: 1; }
.card .cc .em { fill: #f0b72a; stroke: #5e3b00; stroke-width: 1; stroke-linejoin: round; }
.card .cc .em .gem { fill: var(--red-suit); stroke-width: .8; } .card.red .cc .em .gem { fill: #2f7fe0; }
.card .cc .fl { font-family: var(--f-card); font-weight: 700; font-size: 50px; fill: currentColor; }
.card .cback { display: none; background: #24104f; }
.card .cback::before { content: ""; position: absolute; inset: calc(var(--cw) * .07); border-radius: calc(var(--c-rad) * .6); box-shadow: 0 0 0 1.5px #ff5ad9, 0 0 0 3px #24104f, 0 0 0 4px rgba(255,90,217,.45);
  background: repeating-linear-gradient(45deg, rgba(255,90,217,.28) 0 1.5px, transparent 1.5px 6px), repeating-linear-gradient(-45deg, rgba(95,240,255,.18) 0 1.5px, transparent 1.5px 6px), #3a1585; }
.card .cback::after { content: ""; position: absolute; left: 50%; top: 50%; width: calc(var(--cw) * .26); height: calc(var(--cw) * .26); transform: translate(-50%, -50%) rotate(45deg);
  background: linear-gradient(135deg, #fff1a8, #ffd23f 45%, #d99a00); box-shadow: 0 0 0 1.5px #24104f, 0 0 0 3px #ff5ad9, 0 0 10px rgba(255,210,63,.6); }
.card.hidden .cface { display: none; } .card.hidden .cback { display: block; }
.card.fd .cface { display: none; } .card.fd .cback { display: block; }
.card.fd .cback::after { content: "?"; display: grid; place-items: center; inset: 0; left: 0; top: 0; width: auto; height: auto; transform: none; box-shadow: none; background: none;
  color: var(--gold); font-family: var(--f-card); font-weight: 700; font-size: calc(var(--cw) * .5); text-shadow: 0 2px 0 #24104f; }
.card.dealing { animation: deal calc(.32s / var(--sp)) cubic-bezier(.2,.8,.3,1.1) both; }
@keyframes deal { from { transform: translate(90px, -160px) rotate(25deg) scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
.card.flipping { animation: flip calc(.36s / var(--sp)) ease-in-out both; }

.card.lit { animation: lit .3s; z-index: 2; }
@keyframes lit { 50% { transform: translateY(-12px) scale(1.14); } }
.card.debuffed .cface::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(45deg, rgba(255,40,70,.35) 0 4px, transparent 4px 8px); z-index: 2; }
.card.shatter { animation: shatter .5s ease-in forwards; }
@keyframes shatter { 30% { transform: scale(1.1) rotate(4deg); filter: brightness(2); } 100% { transform: scale(.4) rotate(-20deg); opacity: 0; filter: brightness(3); } }
.card.dim { filter: brightness(.55) saturate(.6); }
.card.picked { outline: 3px solid var(--gold); outline-offset: 2px; transform: translateY(-8px); }
.card .etag { position: absolute; left: 50%; bottom: 2px; transform: translateX(-50%); font-family: var(--f-card); font-weight: 700; font-size: calc(var(--cw) * .17); letter-spacing: .02em; line-height: 1.15; padding: 0 .4em; border-radius: 3px; box-shadow: 0 1px 0 rgba(0,0,0,.35); color: #fff; background: #000; white-space: nowrap; z-index: 3; }
.card .seal { position: absolute; right: 2px; top: 2px; width: calc(var(--cw) * .2); height: calc(var(--cw) * .2); border-radius: 50%; box-shadow: 0 0 0 1px #000, inset -2px -2px 0 rgba(0,0,0,.3); z-index: 3; }
.seal.s-rouge { background: #ff2d4a; } .seal.s-or { background: #ffd23f; } .seal.s-bleu { background: #33c4ff; } .seal.s-violet { background: #b56cff; }
.card.e-bonus .cface { box-shadow: var(--c-edge), inset 0 0 0 3px var(--chips), var(--c-drop); } .card.e-bonus .etag { background: var(--chips-d); }
.card.e-feu .cface { box-shadow: var(--c-edge), inset 0 0 0 3px #ff7a1a, var(--c-drop); }
.card.e-feu .cface::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 36%; background: repeating-linear-gradient(90deg, #ff3b1a 0 4px, #ffb21a 4px 8px);
  clip-path: polygon(0 100%, 0 60%, 10% 20%, 20% 60%, 30% 0, 40% 55%, 50% 15%, 60% 60%, 70% 5%, 80% 55%, 90% 25%, 100% 60%, 100% 100%); opacity: .55; transform-origin: bottom; animation: flame .5s ease-in-out infinite alternate; }
@keyframes flame { to { transform: scaleY(.75) translateX(2px); } }
.card.e-feu .etag { background: #c33a00; }
.card.e-verre .cface { background: linear-gradient(135deg, rgba(220,250,255,.78), rgba(170,225,255,.58)); }
.card.e-verre .cface::after { content: ""; position: absolute; inset: -20%; background: linear-gradient(115deg, transparent 40%, rgba(255,255,255,.85) 47%, transparent 54%); animation: shine 2.4s linear infinite; }
@keyframes shine { from { transform: translateX(-60%); } to { transform: translateX(60%); } }
.card.e-verre .etag { background: #1b7a8f; }
.card.e-or .cface { background: linear-gradient(135deg, #ffe680, #f2b705 50%, #ffe680); }
.card.e-or .cface::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 42%, rgba(255,255,255,.7) 50%, transparent 58%); animation: shine 3s linear infinite; }
.card.e-or .etag { background: var(--gold-d); }
.card.e-fantome { opacity: .64; } .card.e-fantome .cface { background: linear-gradient(180deg, #e9dcff, #bfa6ff); animation: ghost 1.6s ease-in-out infinite; will-change: transform; }
@keyframes ghost { 50% { transform: skewX(4deg); } }
.card.e-fantome .etag { background: var(--purple-d); }
.card.e-pierre .cface { background: repeating-linear-gradient(135deg, #8b8496 0 6px, #7a7386 6px 12px); }
.card.e-pierre .ci, .card.e-pierre .cc { opacity: .12; }
.card.e-pierre .etag { background: #3f3a4d; }
.card.e-chance .cface { box-shadow: var(--c-edge), inset 0 0 0 3px #46f08c, var(--c-drop); background: radial-gradient(circle at 70% 30%, #e8ffe9, var(--paper) 60%); }
.card.e-chance .etag { background: var(--green-d); }
.card.e-cameleon .cface { background: linear-gradient(135deg, #ffd6e0, #d6f0ff, #e5ffd6, #fff2c9); background-size: 300% 300%; background-position: 50% 50%; }
.card.e-cameleon .cface::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(135deg, rgba(255,140,170,.35), rgba(120,200,255,.35), rgba(160,255,120,.35)); animation: hue 4s ease-in-out infinite alternate; will-change: opacity; }
@keyframes hue { from { opacity: 0; } to { opacity: 1; } }

.card.e-elastique .cface { box-shadow: var(--c-edge), inset 0 0 0 3px #ff8fc8, var(--c-drop); }
.card.e-elastique .etag { background: #a8326f; }
.ed-brillant .cface::before, .slot.ed-brillant::before, .item.ed-brillant::before, .choice.ed-brillant::before { content: ""; position: absolute; inset: 0 -150% 0 -150%; pointer-events: none; z-index: 2; will-change: transform;
  background: linear-gradient(120deg, transparent 40%, rgba(200,230,255,.5) 46%, rgba(255,255,255,.75) 50%, rgba(200,230,255,.5) 54%, transparent 60%); animation: foil 2.6s linear infinite; }
@keyframes foil { from { transform: translateX(-35%); } to { transform: translateX(35%); } }
.ed-holo .cface::before, .slot.ed-holo::before, .item.ed-holo::before, .choice.ed-holo::before { content: ""; position: absolute; inset: -4px 0 0; pointer-events: none; z-index: 2; will-change: transform, opacity;
  background: repeating-linear-gradient(0deg, rgba(255,80,120,.25) 0 2px, rgba(80,200,255,.25) 2px 4px); animation: holo 1.4s ease-in-out infinite alternate; }
@keyframes holo { from { transform: translateY(0); opacity: .7; } to { transform: translateY(4px); opacity: 1; } }
.ed-prisme .cface::before, .slot.ed-prisme::before, .item.ed-prisme::before, .choice.ed-prisme::before { content: ""; position: absolute; inset: -60%; pointer-events: none; z-index: 2;
  background: conic-gradient(from 0deg, rgba(255,0,80,.35), rgba(255,200,0,.35), rgba(0,255,140,.35), rgba(0,160,255,.35), rgba(200,0,255,.35), rgba(255,0,80,.35)); animation: prisme 3s linear infinite; will-change: transform; }
@keyframes prisme { to { transform: rotate(360deg); } }
:is(.slot, .item, .choice):is(.ed-brillant, .ed-holo, .ed-prisme) { overflow: hidden; }
.slot.ed-negatif, .item.ed-negatif, .choice.ed-negatif { filter: invert(1) hue-rotate(180deg); }

/* ---------- Boîte de score ---------- */
#scorebox { padding: 3px 8px 4px; display: grid; gap: 1px; text-align: center; min-height: 78px; align-content: center; position: relative; overflow: visible; }
#sbType { font-size: 12px; color: var(--dim); height: 15px; white-space: nowrap; overflow: hidden; }
.sbrow { display: flex; align-items: center; justify-content: center; gap: 8px; }
.cm { font-family: var(--f-num); font-size: 32px; line-height: 1; min-width: 86px; padding: 1px 8px; color: #fff; text-align: center; font-variant-numeric: tabular-nums;
  clip-path: polygon(3px 0, calc(100% - 3px) 0, 100% 3px, 100% calc(100% - 3px), calc(100% - 3px) 100%, 3px 100%, 0 calc(100% - 3px), 0 3px); }
#sbChips { background: var(--chips-d); box-shadow: inset 0 -4px 0 rgba(0,0,0,.3); text-align: right; }
#sbMult { background: var(--mult-d); box-shadow: inset 0 -4px 0 rgba(0,0,0,.3); text-align: left; }
.cm.pulse { animation: bump calc(.25s / var(--sp)); }
.cm.big { animation: bigpulse .35s; }
@keyframes bigpulse { 30% { transform: scale(1.45) rotate(-4deg); filter: brightness(1.6); } }
.sbx { font-family: var(--f-num); font-size: 30px; color: var(--ink); }
#sbMsg { font-weight: 700; font-size: 16px; height: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: .02em; }
#sbMsg.good { color: var(--green); } #sbMsg.bad { color: var(--mult); } #sbMsg.gold { color: var(--gold); } #sbMsg.info { color: var(--ink); }
#sbMsg.big { animation: bump .4s; }
#scorebox.burst { animation: burst .5s; }
@keyframes burst { 30% { transform: scale(1.06); } }
#scorebox::after { content: ""; position: absolute; inset: 0; pointer-events: none; box-shadow: 0 0 40px var(--gold); opacity: 0; }
#scorebox.burst::after { animation: glow .5s ease-out; }
@keyframes glow { 30% { opacity: 1; } }
#scorebox.fire::before { content: ""; position: absolute; left: 4px; right: 4px; top: -18px; height: 22px; pointer-events: none;
  background: repeating-linear-gradient(90deg, #ff3b1a 0 6px, #ffb21a 6px 12px, #ffe14a 12px 16px);
  clip-path: polygon(0 100%, 0 50%, 5% 10%, 10% 60%, 16% 0, 22% 55%, 28% 20%, 34% 65%, 40% 5%, 46% 60%, 52% 15%, 58% 55%, 64% 0, 70% 60%, 76% 25%, 82% 65%, 88% 10%, 94% 55%, 100% 30%, 100% 100%);
  transform-origin: bottom; animation: flame .3s ease-in-out infinite alternate; }

/* ---------- Actions ---------- */
#actions { display: grid; gap: 6px; padding-bottom: 2px; }
.arow { display: grid; gap: 6px; grid-auto-flow: column; grid-auto-columns: 1fr; }
.arow.small .btn { min-height: 42px; font-size: 15px; }
.arow .ghost { visibility: hidden; }

/* ---------- Effets ---------- */
.pop { position: fixed; transform: translate(-50%, -100%); font-family: var(--f-num); font-size: 24px; line-height: 1; padding: 1px 6px 2px; color: #fff; white-space: nowrap;
  text-shadow: 2px 2px 0 rgba(0,0,0,.6); box-shadow: 0 0 0 2px #000; animation: popup calc(.9s / var(--sp)) ease-out forwards; z-index: 2; }
.pop.chips { background: #1679c2; } .pop.mult { background: #d01a46; } .pop.xmult { background: #b0002c; font-size: 30px; }
.pop.money { background: var(--gold-d); color: #fff7cc; } .pop.info, .pop.msg { background: #3a2a6a; font-size: 18px; } .pop.debuff { background: #333; color: #ff8095; font-size: 16px; }
@keyframes popup { 0% { transform: translate(-50%, -60%) scale(.6) rotate(-6deg); opacity: 0; } 15% { transform: translate(-50%, -115%) scale(1.2) rotate(3deg); opacity: 1; } 70% { opacity: 1; } 100% { transform: translate(-50%, -190%) scale(1); opacity: 0; } }
.bigscore { position: fixed; left: 50%; top: 45%; transform: translate(-50%, -50%); font-family: var(--f-num); font-size: 76px; color: var(--gold); z-index: 3;
  text-shadow: 4px 4px 0 var(--mult-d), -3px 0 0 var(--chips), 0 0 30px rgba(255,210,63,.7); animation: bigscore calc(1.1s / var(--sp)) cubic-bezier(.2,.9,.3,1.3) forwards; white-space: nowrap; }
@keyframes bigscore { 0% { transform: translate(-50%,-50%) scale(.2) rotate(-8deg); opacity: 0; } 25% { transform: translate(-50%,-50%) scale(1.25) rotate(3deg); opacity: 1; } 75% { transform: translate(-50%,-50%) scale(1); opacity: 1; } 100% { transform: translate(-50%,-160%) scale(.5); opacity: 0; } }
.spark { position: fixed; width: 6px; height: 6px; animation: spark .7s ease-out forwards; }
@keyframes spark { to { transform: translate(var(--dx), var(--dy)); opacity: 0; } }
.tilt { transform: perspective(500px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .18s cubic-bezier(.2,.8,.3,1); }

/* ---------- Modales ---------- */
#modalWrap, #sheetWrap, #packWrap { position: fixed; inset: 0; z-index: 60; display: none; background: rgba(5, 0, 14, .62); }
#packWrap { z-index: 55; background: rgba(5, 0, 14, .8); }
#modalWrap.on { display: grid; place-items: center; padding: 16px max(16px, env(safe-area-inset-left, 0px)); }
#modal { width: min(440px, 100%); max-height: calc(100% - 20px); overflow: auto; padding: 16px; display: grid; gap: 12px; text-align: center; animation: modalin .28s cubic-bezier(.2,.9,.3,1.2); }
@keyframes modalin { from { transform: scale(.85); opacity: 0; } }
#modal h2 { margin: 0; font-size: 26px; line-height: 1.05; text-wrap: balance; }
#modal h2.boss { color: #ff8095; } #modal h2.win { color: var(--green); } #modal h2.gold { color: var(--gold); } #modal h2.bad { color: var(--mult); }
#modal p { margin: 0; color: var(--dim); line-height: 1.35; }
#modal .big { font-family: var(--f-num); font-size: 46px; color: var(--gold); line-height: 1; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; text-align: left; font-size: 15px; }
.kv span:nth-child(even) { font-family: var(--f-num); font-size: 22px; color: var(--gold); text-align: right; line-height: 1; }
.kv .neg { color: var(--mult) !important; }
.kv .tot { border-top: 2px dashed #3d2d70; padding-top: 6px; color: var(--ink); font-weight: 700; }
.kv .row-in { animation: modalin .25s cubic-bezier(.2,.8,.3,1) both; }
.btnrow { display: grid; gap: 8px; grid-auto-flow: column; grid-auto-columns: 1fr; }
.howto { text-align: left; display: grid; gap: 10px; font-size: 14px; line-height: 1.4; color: var(--ink); }
.howto h3 { margin: 4px 0 0; font-size: 15px; color: var(--gold); }
.howto p { color: var(--ink) !important; }
.howto .c { color: var(--chips); } .howto .m { color: var(--mult); }
#sheetWrap { z-index: 70; }
/* Infobulle au survol (souris) : même contenu que la feuille de détail, sans les boutons */
#tip { position: fixed; left: 0; top: 0; z-index: 90; width: max-content; max-width: min(320px, calc(100vw - 16px)); padding: 10px 12px; display: grid; gap: 7px;
  background: rgba(16, 6, 36, .97); border: 2px solid var(--tc); box-shadow: 0 0 0 2px #000, 4px 6px 0 rgba(0,0,0,.5), 0 0 18px color-mix(in srgb, var(--tc) 35%, transparent);
  pointer-events: none; opacity: 0; visibility: hidden; transition: opacity .12s, visibility 0s .12s; }
#tip.on { opacity: 1; visibility: visible; transition: opacity .12s; }
#tip .sh-head { gap: 10px; } #tip .sh-icon { width: 44px; height: 44px; } #tip .sh-icon svg { width: 30px; height: 30px; } #tip .sh-icon .card { --cw: 30px; } #tip .sh-icon .packart { width: 30px; height: 40px; } #tip .sh-icon .packart svg { width: 18px; height: 18px; }
#tip .sh-name { font-size: 16px; } #tip .sh-desc { font-size: 14px; } #tip .sh-extra, #tip .sh-note { font-size: 12px; }
#tip .tip-foot { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
#tip .tip-price { font-family: var(--f-num); font-size: 24px; line-height: 1; color: var(--gold); }
#tip .tip-hint { font-size: 11px; color: var(--dim); }
#sheetWrap.on { display: block; }
#sheet { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: min(480px, 100%); max-height: 85%; overflow-y: auto;
  padding: 14px max(16px, env(safe-area-inset-left, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 10px; animation: sheetin .24s cubic-bezier(.2,.8,.3,1); }
@keyframes sheetin { from { transform: translate(-50%, 40px); opacity: 0; } }
.sh-head { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; }
.sh-icon { width: 60px; height: 60px; display: grid; place-items: center; border: 2px solid var(--rc, var(--edge)); background: rgba(0,0,0,.4); position: relative; }
.sh-icon svg { width: 40px; height: 40px; }
.sh-icon .card { --cw: 40px; animation: none; }
.sh-name { font-size: 20px; font-weight: 700; }
.sh-rar { font-size: 12px; color: var(--rc, var(--dim)); text-transform: uppercase; letter-spacing: .08em; }
.sh-desc { font-size: 16px; line-height: 1.35; }
.sh-note { font-size: 13px; color: var(--mult); }
.sh-extra { font-size: 13px; color: var(--dim); line-height: 1.35; }
.sh-extra b { color: var(--cyan); font-weight: 400; }

/* ---------- Paquet / tirage ---------- */
#packWrap.on { display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 12px max(16px, env(safe-area-inset-left, 0px)); }
#pack { width: min(460px, 100%); max-height: 100%; overflow-y: auto; display: grid; gap: 10px; padding: 12px; text-align: center; }
#pack h2 { margin: 0; font-size: 22px; }
#pack .sub { color: var(--dim); font-size: 13px; }
.choices { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.choice { width: 88px; min-height: 118px; border: 2px solid var(--rc, #3d2d70); background: rgba(10,4,24,.85); padding: 6px 4px; display: grid; justify-items: center; align-content: start; gap: 4px; position: relative;
  animation: fanin .45s cubic-bezier(.2,.9,.3,1.3) both; animation-delay: calc(var(--i) * .07s); }
@keyframes fanin { from { transform: translateY(-80px) rotateY(90deg) scale(.6); opacity: 0; } }
.choice.sel { outline: 3px solid var(--gold); outline-offset: 2px; transform: translateY(-6px); }
.choice svg.ico { width: 40px; height: 40px; } .choice svg.coin { width: 54px; height: 54px; }
.choice .iname { font-size: 12px; line-height: 1.1; }
.choice .card { --cw: 52px; animation: none; }
.choice.k-arcane { --rc: var(--purple); } .choice.k-arcane svg.ico { color: #d6a8ff; }
.choice.k-etoile { --rc: var(--gold); } .choice.k-etoile svg.ico { color: var(--gold); }
.choice.k-spectre { --rc: var(--cyan); } .choice.k-spectre svg.ico { color: var(--cyan); }
.chdesc { min-height: 40px; font-size: 14px; line-height: 1.35; }
.tirage { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; padding: 6px; background: rgba(0,0,0,.3); }
.tirage .card { --cw: 40px; animation: none; cursor: pointer; }
.packart { width: 70px; height: 96px; margin: 0 auto; position: relative; box-shadow: 0 0 0 2px #000, 4px 5px 0 rgba(0,0,0,.5);
  background: repeating-linear-gradient(45deg, var(--pa) 0 8px, var(--pb) 8px 16px); display: grid; place-items: center; }
.packart::after { content: ""; position: absolute; inset: 6px; border: 2px dashed rgba(255,255,255,.7); }
.packart svg { width: 34px; height: 34px; color: #fff; filter: drop-shadow(2px 2px 0 #000); }
.packart.opening { animation: packshake .6s ease-in-out both; }
@keyframes packshake { 0%,100% { transform: none; } 20% { transform: rotate(-8deg) scale(1.05); } 40% { transform: rotate(8deg) scale(1.1); } 60% { transform: rotate(-6deg) scale(1.2); } 80% { transform: scale(1.4); opacity: 1; } 100% { transform: scale(1.8); opacity: 0; } }

/* ---------- Paquet du joueur ---------- */
.tabs { display: grid; grid-auto-flow: column; gap: 5px; }
.tabs .btn { min-height: 36px; font-size: 13px; padding: 2px 4px; }
.deckgrid { display: grid; gap: 4px; }
.deckrow { display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; }
.deckrow .card { --cw: 30px; animation: none; }
.deckrow .card .cc, .deckrow .card .br { display: none; }
.deckrow .card .ci { font-size: 15px; }
.deckrow .card .ci svg { width: 9px; height: 9px; }
.deckrow .card .etag { font-size: 9px; padding: 0 1px; }
.deckrow .card .seal { width: 7px; height: 7px; }
.deckrow .card.used { filter: grayscale(1) brightness(.4); }
.dsum { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.dsum div { background: rgba(0,0,0,.35); padding: 4px 2px; font-size: 11px; color: var(--dim); }
.dsum b { display: block; font-family: var(--f-num); font-size: 24px; color: var(--ink); font-weight: 400; line-height: 1; }
.lvl { display: grid; grid-template-columns: 1fr auto auto auto; gap: 4px 10px; text-align: left; align-items: center; font-size: 14px; }
.lvl .c { color: var(--chips); font-family: var(--f-num); font-size: 20px; } .lvl .m { color: var(--mult); font-family: var(--f-num); font-size: 20px; } .lvl .n { color: var(--dim); font-family: var(--f-num); font-size: 18px; }
.chiplist { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.chiplist span { font-size: 12px; padding: 3px 6px; border: 2px solid var(--gold); color: var(--gold); text-align: left; }
.colgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 6px; }
.colitem { border: 2px solid var(--rc, #3d2d70); background: rgba(10,4,24,.7); padding: 4px 2px; display: grid; justify-items: center; gap: 2px; font-size: 10px; line-height: 1.05; min-height: 70px; align-content: start; position: relative; }
.colitem svg { width: 28px; height: 28px; }
.colitem.unseen svg { filter: brightness(0); opacity: .5; }

/* ---------- Boutique ---------- */
#shop { overflow-y: auto; padding-block: 8px 10px; gap: 8px; -webkit-overflow-scrolling: touch; }
.shophead { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; }
.shophead h2 { margin: 0; font-size: 24px; color: var(--green); text-shadow: 3px 3px 0 #000; }
.sec { padding: 8px 10px 10px; display: grid; gap: 8px; }

<script>
/* ===================== FIÈVRE 21 — DONNÉES ===================== */
(function (root) {
'use strict';

/* ---------- Types de main (niveaux via les Étoiles) ---------- */
// ordre = priorité : la première condition remplie donne le type de la main
const HAND_TYPES = {
  septs:     { name: 'Triple Sept',  chips: 120, mult: 10, lc: 40, lm: 4, star: 'pleiades', desc: 'Exactement trois 7 (21)' },
  couleur21: { name: 'Couleur 21',   chips: 70,  mult: 7,  lc: 30, lm: 3, star: 'aldebaran', desc: '21 avec des cartes toutes de la même couleur' },
  brelan:    { name: 'Brelan',       chips: 50,  mult: 5,  lc: 25, lm: 2, star: 'betelgeuse', desc: 'Trois cartes de même rang' },
  blackjack: { name: 'Blackjack',    chips: 40,  mult: 5,  lc: 20, lm: 2, star: 'antares', desc: '21 avec tes 2 premières cartes' },
  suite:     { name: 'Suite',        chips: 40,  mult: 4,  lc: 25, lm: 2, star: 'rigel', desc: '3 cartes ou plus aux rangs qui se suivent' },
  charlie:   { name: 'Charlie',      chips: 35,  mult: 4,  lc: 25, lm: 2, star: 'altair', desc: '5 cartes ou plus sans dépasser 21' },
  couleur:   { name: 'Couleur',      chips: 30,  mult: 3,  lc: 15, lm: 2, star: 'vega', desc: '3 cartes ou plus toutes de la même couleur' },
  vingtun:   { name: '21',           chips: 20,  mult: 3,  lc: 15, lm: 1, star: 'sirius', desc: 'Exactement 21' },
  paire:     { name: 'Paire',        chips: 15,  mult: 2,  lc: 15, lm: 1, star: 'castor', desc: 'Deux cartes de même rang' },
  simple:    { name: 'Main simple',  chips: 10,  mult: 1,  lc: 10, lm: 1, star: 'polaris', desc: 'Toute autre main' },
};
const HAND_TYPE_IDS = Object.keys(HAND_TYPES);
const TWENTYONE_TYPES = ['septs', 'couleur21', 'blackjack', 'vingtun'];

/* ---------- Étoiles ---------- */
const ETOILES = {};
for (const t of HAND_TYPE_IDS) {
  const names = { pleiades: 'Pléiades', aldebaran: 'Aldébaran', betelgeuse: 'Bételgeuse', antares: 'Antarès', rigel: 'Rigel', altair: 'Altaïr', vega: 'Véga', sirius: 'Sirius', castor: 'Castor', polaris: 'Polaris' };
  const id = HAND_TYPES[t].star;
  ETOILES[id] = { id, name: names[id], type: t, price: 3, desc: `+1 niveau pour ${HAND_TYPES[t].name}` };
}

/* ---------- Améliorations, éditions, sceaux ---------- */
const ENH = {
  bonus:     { name: 'Bonus',     tag: '+30',  desc: '+30 Jetons quand elle marque' },
  feu:       { name: 'Feu',       tag: '+4',   desc: '+4 Mult quand elle marque' },
  verre:     { name: 'Verre',     tag: '×2',   desc: '×2 Mult quand elle marque, 1 chance sur 4 de se briser' },
  or:        { name: 'Or',        tag: '$3',   desc: '+$3 si la main est gagnée' },
  fantome:   { name: 'Fantôme',   tag: '0',    desc: 'Compte pour 0 dans le total mais rapporte ses jetons' },
  pierre:    { name: 'Pierre',    tag: '+50',  desc: 'Vaut toujours 10, +50 Jetons, sans rang ni couleur' },
  chance:    { name: 'Chance',    tag: '?',    desc: '1 chance sur 5 : +20 Mult. 1 chance sur 15 : +$20' },
  cameleon:  { name: 'Caméléon',  tag: '★',    desc: 'Compte comme toutes les couleurs' },
  elastique: { name: 'Élastique', tag: '~',    desc: 'Vaut 1 si sa valeur te ferait dépasser 21' },
};
const ENH_IDS = Object.keys(ENH);
const EDITIONS = {
  brillant: { name: 'Brillant',       desc: '+50 Jetons', price: 2 },
  holo:     { name: 'Holographique',  desc: '+10 Mult', price: 3 },
  prisme:   { name: 'Prismatique',    desc: '×1,5 Mult', price: 5 },
  negatif:  { name: 'Négatif',        desc: '+1 emplacement', price: 5 },
};
const SEALS = {
  rouge:  { name: 'Sceau rouge',  desc: 'La carte se déclenche une fois de plus' },
  or:     { name: 'Sceau doré',   desc: '+$3 quand la carte marque' },
  bleu:   { name: 'Sceau bleu',   desc: "Si la main est gagnée, crée l'Étoile du type de main" },
  violet: { name: 'Sceau violet', desc: 'Quand la carte est jetée, crée un Arcane' },
};

/* ---------- Porte-bonheur ---------- */
// c = contexte de score. Effet : { chips, mult, xmult, money }
const Ch = {};
function def(id, name, rarity, price, desc, hooks) { Ch[id] = Object.assign({ id, name, rarity, price, desc }, hooks || {}); }
const st = (i, k, d) => (i.st[k] == null ? d : i.st[k]);
const X = v => Math.round(v * 100) / 100;

// --- Originaux (version 1, retouchés)
def('pilepoil', 'Pile Poil', 'u', 6, '×3 Mult si la main fait exactement 21', { onHand: c => c.total === 21 ? { xmult: 3 } : null });
def('charlie', 'Quatuor', 'c', 4, '+6 Mult si la main a 4 cartes ou plus', { onHand: c => c.n >= 4 ? { mult: 6 } : null });
def('cassecou', 'Casse-cou', 'u', 6, '+3 Mult par carte au-delà de 2', { onHand: c => c.n > 2 ? { mult: 3 * (c.n - 2) } : null });
def('prudence', 'Prudence', 'c', 4, '+60 Jetons si la main fait 17 ou moins', { onHand: c => c.total <= 17 ? { chips: 60 } : null });
def('maudit', 'Croupier Maudit', 'u', 6, '×2 Mult si le croupier dépasse 21', { onHand: c => c.dealerBust ? { xmult: 2 } : null });
def('lynx', 'Œil de Lynx', 'c', 4, 'La carte cachée du croupier est visible');

  init() {

  const t = document.createElement('div'); t.className = 'toast ' + (kind || ''); t.textContent = msg;
  const box = $('#toasts'); box.appendChild(t);
  while (box.children.length > 4) box.firstChild.remove();
  setTimeout(() => t.remove(), 2500);
}
function drainLog() { if (!ui.run) return; F.drain(ui.run).forEach(l => toast(l.msg, l.kind)); }

/* ---------- Cartes : rangées ---------- */
function fitCards() {
  const z1 = $('#dealerZone'), z2 = $('#playerZone');
  const W = (z2 && z2.clientWidth) || Math.min(window.innerWidth, 480) - 32;
  let cw = Math.min(W * .17, W > 600 ? 120 : W > 440 ? 96 : 74);
  if ($('#game').classList.contains('on') && z1 && z2) {
    const zh = Math.min(z1.clientHeight, z2.clientHeight);
    if (zh > 0) cw = Math.min(cw, (zh - 36) / 1.42);
  }
  cw = Math.max(34, cw);
  document.documentElement.style.setProperty('--cwb', cw.toFixed(1) + 'px');
  document.querySelectorAll('.row').forEach(layoutRow);
}
function layoutRow(row) {
  const cards = [...row.children].filter(e => !e.classList.contains('leaving'));
  const n = cards.length; if (!n) return;
  const cw = cards[0].offsetWidth || 50;
  const W = row.clientWidth - 6;
  let ov = 6;
  if (n > 1 && n * cw + (n - 1) * 6 > W) ov = (W - n * cw) / (n - 1);
  row.style.setProperty('--ov', ov.toFixed(1) + 'px');
  const mid = (n - 1) / 2, step = Math.min(5, 20 / n);
  cards.forEach((el, i) => { el.style.setProperty('--rot', ((i - mid) * step).toFixed(1) + 'deg'); el.style.setProperty('--ty', (Math.pow(Math.abs(i - mid), 1.6) * 1.8).toFixed(1) + 'px'); });
}
function syncRow(row, list) {
  const existing = new Map();
  [...row.children].forEach(e => { if (!e.classList.contains('leaving')) existing.set(e.dataset.id, e); });
  const keep = new Set(list.map(x => x.card.id));
  for (const [id, el] of existing) if (!keep.has(id)) { el.classList.add('leaving'); setTimeout(() => el.remove(), 320); }
  list.forEach((x, i) => {
    let el = existing.get(x.card.id);
    if (el && el.dataset.sig !== sig(x.card)) { const nel = cardEl(x.card); nel.className = el.className; el.replaceWith(nel); el = nel; el.classList.remove('e-' + 'x'); syncClasses(el, x.card); }
    if (!el) {
      el = cardEl(x.card);
      if (!RM) { el.classList.add('dealing'); setTimeout(() => el.classList.remove('dealing'), 420 / opts.speed); }
      if (x.hidden) el.classList.add('hidden');
      row.appendChild(el);
    } else if (el.classList.contains('hidden') && !x.hidden) {
      el.classList.remove('hidden'); el.classList.add('flipping'); setTimeout(() => el.classList.remove('flipping'), 420 / opts.speed);
    } else if (x.hidden) el.classList.add('hidden');
    el.dataset.sig = sig(x.card);
    el.style.setProperty('--i', i);
    el.classList.toggle('dim', !!x.dim);
    el.classList.toggle('fd', !!x.fd);
    el.classList.toggle('debuffed', !!x.debuffed);
  });
  layoutRow(row);
}
const sig = c => `${c.rank}${c.suit}${c.enh || ''}${c.ed || ''}${c.seal || ''}`;
function syncClasses(el, c) {
  const base = ['card', c.suit === 'H' || c.suit === 'D' ? 'red' : '', c.rank === 1 ? 'ace' : '', c.rank >= 11 ? 'face' : '', c.enh ? 'e-' + c.enh : '', c.ed ? 'ed-' + c.ed : ''];
  el.className = base.join(' ');
}

function sparks(x, y, n, color) {

    const a = Math.random() * Math.PI * 2, d = 40 + Math.random() * 90;

}

function tween(el, from, to, ms, fmtFn) {
  const t0 = performance.now(); ms = ms / opts.speed;
  const step = now => { const k = Math.min(1, (now - t0) / ms); const e = 1 - Math.pow(1 - k, 3); el.textContent = fmtFn(from + (to - from) * e); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
// inclinaison 3D au toucher / survol
let tiltEv = null;
document.addEventListener('pointermove', e => {
  if (RM) return;
  if (!tiltEv) requestAnimationFrame(() => {
    const ev = tiltEv; tiltEv = null;
    const el = ev.target.closest && ev.target.closest('.tilt'); if (!el) return;
    const r = el.getBoundingClientRect();
    el.style.setProperty('--ry', (((ev.clientX - r.left) / r.width - .5) * 22).toFixed(1) + 'deg');
    el.style.setProperty('--rx', (-((ev.clientY - r.top) / r.height - .5) * 22).toFixed(1) + 'deg');

/* ---------- Déroulé d'une main ---------- */
async function dealFlow() {
  const run = ui.run;
  ui.busy = true; ui.fast = false; ui.scoringHand = -1; ui.revealFd = false;
  ui.dealerRevealed = false; ui.dealerShown = null;
  $('#scorebox').classList.remove('fire');
  setBox(0, 0, ''); setMsg('');
  const ev = F.dealHand(run);
  ui.dealLimit = { p: 0, d: 0 };
  renderGame();
  for (const [who, n] of [['p', 1], ['d', 1], ['p', 2], ['d', 2]]) { ui.dealLimit[who] = n; renderDealer(); renderPlayer(); Snd.deal(); await sleep(160); }
  ui.dealLimit = null;
  renderGame();
  for (const e of ev) {
    if (e.type === 'pourpre') { const el = charmByUid(e.uid); popup(el, 'Désactivé', 'debuff'); trig(el); await sleep(500); }
    if (e.type === 'contre') { const i = ui.run.charms.findIndex(x => x.id === 'contre'); trig(charmSlot(i)); popup(charmSlot(i), 'Contre-Attaque !', 'info'); setMsg('Blackjack du croupier annulé !', 'good', true); Snd.coin(); await sleep(700); }
    if (e.type === 'dealerBJ') { ui.dealerRevealed = true; renderDealer(); Snd.flip(); setMsg('Blackjack du croupier…', 'bad', true); await sleep(900); return resolveFlow(); }
    if (e.type === 'playerBJ') { setMsg('BLACKJACK !', 'gold', true); Snd.big(); sparks(window.innerWidth / 2, window.innerHeight * .7, 18); await sleep(800); return resolveFlow(); }
  }
  setMsg('Tirer ou rester ?', 'info');
  ui.busy = false;
  renderActions(); renderPlayer();
}
async function bustFx() {
  shakeScreen(); Snd.bust(); BG.set('bust'); setMsg('BUST !', 'bad', true);
  await sleep(650);
  BG.set(ui.run.blind.boss ? 'boss' : 'normal');
}
async function onAction(a) {
  const run = ui.run;
  Snd.init();
  if (a === 'deal') { if (ui.busy || run.phase !== 'ready') return; Snd.click(); return dealFlow(); }
  if (ui.busy) return;
  const res = F.act(run, a);
  if (!res.ok) return;
  if (a === 'jet' || a === 'jetBust') { Snd.flip(); setMsg('Carte jetée', 'info'); } else if (res.card) Snd.deal(); else Snd.click();
  renderGame();
  drainLog();
  if (a === 'split') setMsg('Main de gauche d\'abord', 'info');
  if (a === 'double') setMsg('Double !', 'good', true);
  if (res.result === 'souffle') { setMsg('Second Souffle : bust annulé !', 'good', true); Snd.magic(); }
  if (run.phase === 'bustChoice') { shakeScreen(); Snd.lose(); setMsg('Ça dépasse 21 ! Jeter la carte ?', 'bad', true); }
  else if (res.result === 'bust' || a === 'acceptBust') { ui.busy = true; renderActions(); await bustFx(); ui.busy = false; }
  else if (res.result === 'twentyone') { setMsg('21 !', 'gold', true); Snd.coin(); }
  if (run.phase === 'player' && run.hands.length > 1 && (a === 'stand' || res.result)) setMsg(`Main ${run.cur + 1} sur ${run.hands.length}`, 'info');
  if (run.phase === 'resolve') { await sleep(250); return resolveFlow(); }
  renderActions();
}
const OUT_TXT = { win: 'GAGNÉ', push: 'ÉGALITÉ', lose: 'PERDU', bust: 'BUST' };
async function resolveFlow() {
  const run = ui.run;
  ui.busy = true; renderActions();
  const before = run.dealer.cards.length;
  const R = F.resolve(run);
  ui.dealerShown = before;
  if (run.hands.some(h => h.fd && h.fd.length)) { ui.revealFd = true; renderPlayer(); Snd.flip(); await sleep(400); }
  if (!ui.dealerRevealed) { await sleep(200); ui.dealerRevealed = true; renderDealer(); Snd.flip(); await sleep(480); }
  for (let i = before; i < run.dealer.cards.length; i++) { ui.dealerShown = i + 1; renderDealer(); Snd.deal(); await sleep(420); }
  ui.dealerShown = null; renderDealer();
  if (R.dealerTotal > 21) { setMsg('Le croupier dépasse 21 !', 'good', true); Snd.coin(); await sleep(600); }
  for (let hi = 0; hi < R.results.length; hi++) {
    ui.scoringHand = run.hands.length > 1 ? hi : -1; renderPlayer();
    const r = R.results[hi];
    await animateResult(r, hi, R.dealerTotal);
    const before2 = run.score;
    F.applyResult(run, r);
    if (run.score !== before2) tween($('#sScore span'), before2, run.score, 500, fmt);
    renderHeader(); renderStats(true);
    if (r.money) { popup($('#sMoney'), `+$${r.money}`, 'money'); Snd.coin(); }
    for (const e of r.after) {
      const el = e.uid ? charmByUid(e.uid) : null;
      if (e.money) { trig(el); popup(el || $('#sMoney'), `+$${e.money}`, 'money'); Snd.coin(); await sleep(260); }
      if (e.msg) { toast(e.msg, 'charm'); if (el) { trig(el); popup(el, e.msg, 'msg'); } await sleep(260); }
    }
    for (const g of r.broken) { const el = cardInHand(hi, g.id); if (el) { el.classList.add('shatter'); popup(el, 'Brisée !', 'info'); } Snd.glass(); await sleep(450); }
    drainLog();
    renderSlots($('#slots'), { game: true }); renderCons($('#consSlots')); renderStats();
    await sleep(250);
  }
  ui.scoringHand = -1;
  const e = F.endHand(run);
  renderGame();
  drainLog();
  if (e === 'won') { await sleep(400); return tableWonFlow(); }
  if (e === 'lost') { await sleep(700); return gameOverFlow(); }
  ui.busy = false; ui.fast = false;
  persist();
  renderActions();
}
async function animateResult(r, hi, dealerTotal) {
  const run = ui.run, h = run.hands[hi];
  const tag = run.hands.length > 1 ? `Main ${hi + 1} : ` : '';
  if (r.outcome === 'bust') setMsg(tag + 'BUST', 'bad', true);
  else if (run.dealerBJ && r.outcome === 'lose') setMsg(tag + 'PERDU contre Blackjack', 'bad', true);
  else setMsg(`${tag}${OUT_TXT[r.outcome]} ${r.playerTotal} contre ${dealerTotal}`, r.outcome === 'win' ? 'good' : r.outcome === 'push' ? 'gold' : 'bad', true);
  if (r.blocked) { await sleep(500); setMsg(r.blocked, 'bad', true); Snd.lose(); await sleep(900); return; }
  if (r.factor === 0) { setBox(0, 0, ''); if (r.outcome !== 'bust') Snd.lose(); await sleep(850); return; }
  for (const m of r.events) toast(m, 'charm');
  await sleep(420);
  const base = r.steps[0];
  setBox(base.chips, base.mult, base.text); Snd.chip(0);
  await sleep(380);
  const remaining = run.target - run.score;
  const box = $('#scorebox');
  let k = 1;
  for (const s of r.steps.slice(1)) {
    let el = null;
    if (s.src === 'card') { el = cardInHand(hi, h.cards[s.ci].id); lit(el); }
    else if (s.src === 'charmCard') { el = charmSlot(s.idx); trig(el); lit(cardInHand(hi, h.cards[s.ci].id)); }
    else if (s.src === 'charm') { el = charmSlot(s.idx); trig(el); }
    else if (s.src === 'cons') { el = consSlot(s.idx); trig(el); }
    else if (s.src === 'double' || s.src === 'plasma') el = $('#sbMult');
    let text = '';
    switch (s.kind) {
      case 'chips': text = `+${fmt(s.val)} Jetons`; break;
      case 'mult': text = `+${fmtM(s.val)} Mult`; break;
      case 'xmult': text = `×${fmtM(s.val)} Mult`; break;
      case 'money': text = `+$${s.val}`; break;
      case 'msg': text = s.val; break;
      case 'debuff': text = 'Désactivée'; break;
      case 'off': text = 'Désactivé'; break;
      case 'retrig': text = 'Encore !'; break;
      case 'plasma': text = 'Équilibre !'; break;
    }
    popup(el, s.src === 'double' ? `${text} (double)` : text, s.kind === 'retrig' || s.kind === 'off' || s.kind === 'plasma' ? 'info' : s.kind);
    setBox(s.chips, s.mult, null, s.kind === 'xmult');
    if (s.kind === 'xmult') { Snd.xmult(k); flash(); } else if (s.kind === 'money') Snd.coin(); else if (s.kind === 'debuff' || s.kind === 'off') Snd.lose(); else Snd.chip(k);
    if (s.chips * s.mult * r.factor >= remaining && remaining > 0) box.classList.add('fire');
    k++;
    await sleep(Math.max(110, 380 - k * 22));
  }
  await sleep(220);
  let txt = `${fmt(r.chips)} × ${fmtM(r.mult)} = ${fmt(r.raw)}`;
  if (r.factor !== 1) txt += `  · ${r.factor * 100} %`;
  setMsg(txt, 'gold', true);
  await sleep(480);
  box.classList.remove('burst'); void box.offsetWidth; box.classList.add('burst');
  bigScore('+' + fmt(r.score));
  if (r.score >= run.target * .5 || r.score >= 1000) Snd.big(); else Snd.win();
  await sleep(850);
  box.classList.remove('fire');
}

/* ---------- Infobulles au survol (souris uniquement ; au doigt, on garde les feuilles) ---------- */
const hoverMQ = matchMedia('(hover: hover) and (pointer: fine)');
const Tip = {
  el: null, cur: null,
  show(target, html) {
    if (!this.el) { this.el = document.createElement('div'); this.el.id = 'tip'; this.el.setAttribute('role', 'tooltip'); document.body.appendChild(this.el); }
    this.cur = target;
    this.el.style.setProperty('--tc', getComputedStyle(target).getPropertyValue('--rc').trim() || 'var(--edge)');
    this.el.innerHTML = html;
    const r = target.getBoundingClientRect(), t = this.el.getBoundingClientRect(), m = 8;
    let top = r.top - t.height - 10;
    if (top < m) top = Math.min(r.bottom + 10, innerHeight - t.height - m);
    const left = Math.max(m, Math.min(r.left + r.width / 2 - t.width / 2, innerWidth - t.width - m));
    this.el.style.translate = `${Math.round(left)}px ${Math.round(Math.max(m, top))}px`;
    this.el.classList.add('on');
  },
  hide(target) { if (this.el && (!target || target === this.cur)) { this.el.classList.remove('on'); this.cur = null; } },
};
function bindTip(el, html) {
  el.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse' && hoverMQ.matches && !ui.busy) Tip.show(el, html()); });
  el.addEventListener('pointerleave', () => Tip.hide(el));
  el.addEventListener('pointerdown', () => Tip.hide());
}

function openPackUI(onClose) {

      <div class="btnrow"><button class="btn b-grey" id="pSkip">Passer</button><button class="btn b-green" id="pTake" ${ch ? '' : 'disabled'}>${ch && ch.cons ? 'Utiliser' : 'Prendre'}</button></div>`;

    root.querySelector('#pTake').onclick = () => {

function openTirage(c, buyItemIdx) {

      <div class="tirage">${tir.map(k => cardHTML(k, picked.has(k.id) ? 'picked' : '')).join('')}</div>

    const root = $('#pack');

      if (!need) return; const id = el.dataset.id;

      Snd.click(); render();

    root.querySelector('#pTake').onclick = () => {

    };
  };
  render();
}

/* ---------- Paquet du joueur ---------- */
function deckRows(cards, o) {
  const order = { S: 0, H: 1, C: 2, D: 3 };
  const sorted = cards.slice().sort((a, b) => order[a.suit] - order[b.suit] || a.rank - b.rank);
  const by = { S: [], H: [], C: [], D: [] };
  sorted.forEach(c => by[c.suit].push(c));
  return Object.values(by).filter(l => l.length).map(l => `<div class="deckrow">${l.map(c => cardHTML(c, (o.used && o.used.has(c.id) ? 'used ' : '') + (o.pick ? 'pickable' : ''))).join('')}</div>`).join('');
}

function shopItemInfo(kind, i) {
  const run = ui.run, s = run.shop;
  let head = '', desc = '', price = 0, note = '', buyLabel = 'Acheter', canUse = false, extra = '';
  if (kind === 'item') {
    const it = s.items[i]; price = F.itemPrice(run, it);
    if (it.kind === 'charm') {
      head = charmHead(it.inst, 'porte-bonheur'); desc = F.charmDesc(run, it.inst); extra = charmExtra(it.inst);
      if (!F.charmRoom(run, it.inst)) note = 'Tous tes emplacements sont pleins : vends un porte-bonheur d\'abord.';
    } else if (it.kind === 'carte') {
      head = `<div class="sh-head"><div class="sh-icon">${cardHTML(it.card)}</div><div><div class="sh-name">${esc(cardName(it.card))}</div><div class="sh-rar">Carte à jouer</div></div></div>`;
      desc = 'S\'ajoute à ton paquet.'; extra = `<div class="sh-extra">${cardDesc(it.card)}</div>`;
    } else {
      const d = F.consDef(it.cons);
      head = `<div class="sh-head"><div class="sh-icon" style="color:${it.kind === 'etoile' ? 'var(--gold)' : it.kind === 'spectre' ? 'var(--cyan)' : '#d6a8ff'}">${consIcon(it.cons)}</div><div><div class="sh-name">${esc(d.name)}</div><div class="sh-rar">${KIND_NAME[it.kind]}</div></div></div>`;
      desc = d.desc; if (it.kind === 'etoile') extra = `<div class="sh-extra">${levelLine(run, d.type)}</div>`;
      canUse = true;
      if (!F.consRoom(run)) note = 'Plus de place pour les consommables : utilise-le directement.';
    }
  } else if (kind === 'pack') {
    const pk = s.packs[i], P = F.PACKS[pk.type], S = F.PACK_SIZES[pk.size];
    price = F.packPrice(run, pk);
    head = `<div class="sh-head"><div class="sh-icon">${packArt(pk.type)}</div><div><div class="sh-name">${esc(P.name)}${S.name ? ' ' + S.name : ''}</div><div class="sh-rar">Paquet</div></div></div>`;
    desc = `Ouvre-le pour choisir ${S.pick} carte${S.pick > 1 ? 's' : ''} parmi ${S.n[P.kind]}.`; buyLabel = 'Ouvrir';
  } else {
    const v = s.vouchers[i], V = F.VOUCHERS[v]; price = F.voucherPrice(run);
    head = `<div class="sh-head"><div class="sh-icon" style="color:#ff9f1a">${voucherIcon(v)}</div><div><div class="sh-name">${esc(V.name)}</div><div class="sh-rar" style="color:#ff9f1a">Talisman · permanent</div></div></div>`;
    desc = V.desc + '.'; if (V.req) extra = `<div class="sh-extra">Amélioration de ${esc(F.VOUCHERS[V.req].name)}.</div>`;
  }
  const afford = F.canAfford(run, price);
  if (!afford) note = `Il te manque $${price - run.money}.`;
  return { head, desc, price, note, buyLabel, canUse, extra, afford };
}
function shopTipHTML(kind, i) {

        <div class="stakeinfo"><b style="color:${S.color}">${esc(S.name)}</b><br>${st.stake === 0 ? esc(S.desc) : 'Cumule : ' + F.STAKES.slice(1, st.stake + 1).map(x => esc(x.desc)).join(' · ')}</div></div>
      <div class="btnrow"><button class="btn b-grey" id="sBack">Retour</button><button class="btn b-gold" id="sGo" ${ok ? '' : 'disabled'}>Commencer</button></div>`;
    $('#dPrev').onclick = () => { st.deck = (st.deck + DECK_IDS.length - 1) % DECK_IDS.length; Snd.click(); render(); };

  };

}
function newGame(deck, stake) {

/* ---------- Compteur d'images par seconde ---------- */
// Mesure en continu (une seule requête d'image par frame, coût négligeable).
// stats() est aussi utilisé par les tests automatiques.
const FPS = {
  el: null, frames: 0, t0: 0, last: 0, worst: 0, now: 0, low: 0, hist: [],
  start() {
    const tick = t => {
      if (this.last) { const dt = t - this.last; this.worst = Math.max(this.worst, dt); this.hist.push(dt); if (this.hist.length > 600) this.hist.shift(); }
      this.last = t; this.frames++;
      if (!this.t0) this.t0 = t;
      if (t - this.t0 >= 500) {
        this.now = this.frames * 1000 / (t - this.t0); this.low = 1000 / Math.max(this.worst, 1);
        if (this.el) { this.el.textContent = `${Math.round(this.now)} FPS · min ${Math.round(this.low)}`; this.el.className = this.now >= 55 ? 'ok' : this.now >= 40 ? 'mid' : 'bad'; }
        this.frames = 0; this.t0 = t; this.worst = 0;
      }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
    this.show(opts.fps);
  },
  show(on) {
    if (on && !this.el) { this.el = document.createElement('div'); this.el.id = 'fpsMeter'; this.el.textContent = '-- FPS'; document.body.appendChild(this.el); }
    if (!on && this.el) { this.el.remove(); this.el = null; }
  },
  reset() { this.hist = []; },
  stats() {
    const h = this.hist.slice().sort((a, b) => a - b), n = h.length;
    if (!n) return { frames: 0 };
    const avg = h.reduce((a, b) => a + b, 0) / n;
    return { frames: n, fps: +(1000 / avg).toFixed(1), p1Low: +(1000 / h[Math.min(n - 1, Math.floor(n * .99))]).toFixed(1), worstMs: +h[n - 1].toFixed(1), over20ms: h.filter(x => x > 20).length };
  },
};
function fpsLabel() { return opts.fps ? 'Compteur FPS : affiché' : 'Compteur FPS : masqué'; }
function soundLabel() { return opts.sound ? 'Son : activé' : 'Son : coupé'; }

            mm => { mm.querySelector('#nNo').onclick = () => openOptions(true); mm.querySelector('#nYes').onclick = () => { Store.del('run'); closeModal(); ui.busy = false; toTitle(); }; });
        };
      }
    });
}
function toTitle() {
  show('title'); BG.set('normal');
  $('#bContinue').hidden = !Store.get('run', null);
  $('#record').textContent = prog.maxAnte ? `Record : ante ${prog.maxAnte} · meilleure main ${fmt(prog.bestHand)}${prog.wins ? ' · ' + prog.wins + ' victoire' + (prog.wins > 1 ? 's' : '') : ''}` : '';
  $('#titleCards').innerHTML = [{ id: 't1', rank: 1, suit: 'S', ed: 'prisme' }, { id: 't2', rank: 13, suit: 'H', enh: 'or', seal: 'rouge' }, { id: 't3', rank: 7, suit: 'D', enh: 'feu' }]
    .map((c, i) => cardHTML(c).replace('class="card', `style="--i:${i}" class="card`)).join('');
}
function continueGame() {
  const s = Store.get('run', null); if (!s) return;
  const run = F.load(s); if (!run) { Store.del('run'); toTitle(); return; }
  ui.run = run;
  if (run.phase === 'shop' && run.shop) return showShop();
  if (run.phase === 'ready' && run.blind) {
    show('game'); BG.set(run.blind.boss ? 'boss' : 'normal');
    run.hands = []; run.dealer = null;
    $('#dRow').innerHTML = ''; $('#hands').innerHTML = '';
    setBox(0, 0, ''); setMsg('Partie reprise', 'info');
    renderGame(); requestAnimationFrame(fitCards); return;
  }
  run.phase = 'select'; showSelect();
}
function howTo() {
  Snd.click();
  modal(`<h2>Comment jouer</h2>
    <div class="howto">
      <p>Bats le croupier au blackjack pour atteindre l'<b>objectif</b> de chaque table avant d'être à court de mains. Chaque ante a 3 tables : petite, grande, puis un boss. Bats les 8 antes pour gagner.</p>
      <h3>Score d'une main</h3>
      <p><span class="c">Jetons</span> × <span class="m">Mult</span>. Ta main a un <b>type</b> (Paire, Couleur, Suite, 21, Charlie, Brelan, Blackjack, Couleur 21, Triple Sept…) qui donne la base, puis chaque carte ajoute sa valeur en jetons. Victoire : 100 %, égalité : 50 %, défaite ou bust : 0.</p>

      <p><b>Tirer</b>, <b>Rester</b>, <b>Doubler</b> (une carte, ×2 Mult), <b>Séparer</b> une paire. Le croupier tire jusqu'à 17. <b>Jeter</b> retire ta dernière carte (2 jets par table) et te sauve d'un bust.</p>
      <h3>Passer une table</h3>
      <p>Tu peux passer la petite ou la grande table pour gagner un <b>badge</b> (argent, paquet gratuit, porte-bonheur rare…). Mais tu rates les gains et la boutique.</p>

      <h3>Cartes spéciales</h3>
      <p>Améliorations (Bonus, Feu, Verre, Or, Fantôme, Pierre, Chance, Caméléon, Élastique), éditions (Brillant, Holographique, Prismatique, Négatif) et sceaux (rouge, doré, bleu, violet).</p>
      <h3>Argent</h3>
      <p>Gain de la table, $1 par main non utilisée, et $1 d'intérêts par tranche de $5 (max $5).</p>
      <h3>Astuces</h3>
      <p>Le type de ta main s'affiche sous ton total : vise les Couleurs et les Suites. Le bouton Paquet montre ce qu'il reste dans ta pioche. Touche l'écran pendant le calcul pour accélérer.</p>
    </div>
    <button class="btn b-gold" id="mClose">Compris</button>`, m => { m.querySelector('#mClose').onclick = closeModal; });
}
function openCollection(tab) {
  Snd.click();
  tab = tab || 'charms';
  const tabs = [['charms', 'Porte-bonheur'], ['cons', 'Cartes'], ['boss', 'Boss'], ['tags', 'Badges'], ['vouch', 'Talismans']];
  let body = '';
  const fake = { stake: 0, deckId: 'rouge', charms: [], deck: [], money: 0, tf: {}, stats: {}, handPlays: {} };
  if (tab === 'charms') {
    const ids = F.CHARM_IDS.slice().sort((a, b) => 'curl'.indexOf(F.CHARMS[a].rarity) - 'curl'.indexOf(F.CHARMS[b].rarity));
    const seen = ids.filter(id => prog.seen[id]).length;
    body = `<p>${seen} / ${ids.length} découverts</p><div class="colgrid">${ids.map(id => { const d = F.CHARMS[id], s = prog.seen[id]; return `<button class="colitem r-${d.rarity} ${s ? '' : 'unseen'}" data-id="${id}">${charmIcon(id)}<span>${s ? esc(d.name) : '???'}</span></button>`; }).join('')}</div>`;
  } else if (tab === 'cons') {
    const g = (kind, src) => Object.keys(src).map(id => `<button class="colitem" data-cons="${kind}:${id}" style="--rc:${kind === 'etoile' ? 'var(--gold)' : kind === 'spectre' ? 'var(--cyan)' : 'var(--purple)'}"><span style="color:${kind === 'etoile' ? 'var(--gold)' : kind === 'spectre' ? 'var(--cyan)' : '#d6a8ff'};display:contents">${consIcon({ kind, id })}</span><span>${esc(src[id].name)}</span></button>`).join('');
    body = `<h3 style="margin:0;color:#d6a8ff">Arcanes</h3><div class="colgrid">${g('arcane', F.ARCANES)}</div><h3 style="margin:0;color:var(--gold)">Étoiles</h3><div class="colgrid">${g('etoile', F.ETOILES)}</div><h3 style="margin:0;color:var(--cyan)">Spectres</h3><div class="colgrid">${g('spectre', F.SPECTRES)}</div>`;
  } else if (tab === 'boss') {
    body = `<div class="kv">${Object.values(F.BOSSES).map(b => `<span style="color:${b.final ? 'var(--gold)' : '#ff8095'}">${esc(b.name)}${b.final ? ' (final)' : ''}</span><span style="font-family:var(--f-text);font-size:13px;color:var(--dim);text-align:right">${esc(b.rule)}</span>`).join('')}</div>`;
  } else if (tab === 'tags') {
    body = `<div class="kv">${Object.values(F.TAGS).map(t => `<span style="color:var(--cyan)">${esc(t.name)}</span><span style="font-family:var(--f-text);font-size:13px;color:var(--dim);text-align:right">${esc(t.desc)}</span>`).join('')}</div>`;
  } else {
    body = `<div class="kv">${Object.values(F.VOUCHERS).map(v => `<span style="color:#ff9f1a">${esc(v.name)}</span><span style="font-family:var(--f-text);font-size:13px;color:var(--dim);text-align:right">${esc(v.desc)}</span>`).join('')}</div>
      <h3 style="margin:8px 0 0">Paquets de départ</h3><div class="kv">${Object.keys(F.DECKS).map(id => `<span>${esc(F.DECKS[id].name)}${deckUnlocked(id) ? '' : ' (verrouillé)'}</span><span style="font-family:var(--f-text);font-size:13px;color:var(--dim);text-align:right">${esc(F.DECKS[id].desc)}</span>`).join('')}</div>`;
  }
  modal(`<h2>Collection</h2><div class="tabs">${tabs.map(([k, n]) => `<button class="btn ${tab === k ? 'b-purple' : 'b-grey'}" data-t="${k}">${n}</button>`).join('')}</div>${body}<button class="btn b-gold" id="mClose">Fermer</button>`,
    m => {
      m.querySelectorAll('[data-t]').forEach(b => { b.onclick = () => openCollection(b.dataset.t); });
      m.querySelector('#mClose').onclick = closeModal;
      m.querySelectorAll('[data-id]').forEach(b => b.addEventListener('click', () => {
        const id = b.dataset.id, d = F.CHARMS[id];
        if (!prog.seen[id]) { sheet(`<div class="sh-name">???</div><div class="sh-desc">Trouve ce porte-bonheur en partie pour le découvrir.</div><button class="btn b-purple" id="shClose">Fermer</button>`, s => { s.querySelector('#shClose').onclick = closeSheet; }); return; }
        sheet(`<div class="sh-head r-${d.rarity}"><div class="sh-icon">${charmIcon(id)}</div><div><div class="sh-name">${esc(d.name)}</div><div class="sh-rar">${RAR[d.rarity]} · $${d.price}</div></div></div><div class="sh-desc">${esc(d.desc)}</div><button class="btn b-purple" id="shClose">Fermer</button>`, s => { s.querySelector('#shClose').onclick = closeSheet; });
      }));
      m.querySelectorAll('[data-cons]').forEach(b => b.addEventListener('click', () => {
        const [kind, id] = b.dataset.cons.split(':'); const d = F.consDef({ kind, id });
        sheet(`<div class="sh-name">${esc(d.name)}</div><div class="sh-rar">${KIND_NAME[kind]}</div><div class="sh-desc">${esc(d.desc)}</div><button class="btn b-purple" id="shClose">Fermer</button>`, s => { s.querySelector('#shClose').onclick = closeSheet; });
      }));
      void fake;
    });
}

  $('#bOptionsT').onclick = () => { Snd.init(); openOptions(false); };

  $('#bOptions').onclick = () => { if (ui.busy) return; openOptions(true); };
  $('#game').addEventListener('pointerdown', e => { if (ui.busy && !e.target.closest('button')) ui.fast = true; });
  window.addEventListener('resize', fitCards);
  FPS.start();
  toTitle();
}
boot();
window.__f21 = { FPS, BG, ui, F, showShop, showSelect, renderGame, openDeck, dealFlow, toTitle, startTableUI, openPackUI, prog };
