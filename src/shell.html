<title>Fièvre 21</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=VT323&display=swap">
<style>
/* Écran d'arcade psyché : fond tourbillon pixel, panneaux sombres, Jetons bleus × Mult rouge */
:root {
  --bg: #0b0418; --ink: #f6efff; --dim: #a596c9;
  --panel: rgba(13, 5, 29, .86); --panel2: rgba(30, 14, 60, .92); --edge: #6d45e8;
  --chips: #33c4ff; --chips-d: #0a6b99; --mult: #ff3b6b; --mult-d: #99133a;
  --gold: #ffd23f; --gold-d: #9c7400; --green: #3ef08a; --green-d: #138a46;
  --boss: #ff2d4a; --purple: #b56cff; --purple-d: #5b2aa8; --cyan: #5ff0ff;
  --grey: #5d5578; --grey-d: #2f2a44;
  --r-c: #5fd0ff; --r-u: #46f08c; --r-r: #ff5ad9; --r-l: #ffd23f;
  --paper: #fbf3df; --paper-ink: #1d1530; --red-suit: #e0213f;
  --f-text: 'Pixelify Sans', ui-monospace, 'Courier New', monospace;
  --f-num: 'VT323', ui-monospace, 'Courier New', monospace;
  --cwb: 60px; --cw: var(--cwb);
  --sp: 1;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); overflow: hidden; font-family: var(--f-text); font-size: 15px;
  -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
button { font-family: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
#bg { position: fixed; inset: 0; transform: translateZ(0); will-change: transform; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; z-index: 0; }
#crt { position: fixed; inset: 0; pointer-events: none; z-index: 95; transform: translateZ(0); will-change: transform; contain: strict; background: repeating-linear-gradient(to bottom, rgba(0,0,0,.2) 0 1px, transparent 1px 3px); }
#crt::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.5) 85%, rgba(0,0,0,.88) 100%); }
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 85; overflow: hidden; contain: strict; }
#flash { position: fixed; inset: 0; pointer-events: none; z-index: 84; will-change: opacity; contain: strict; background: var(--mult); opacity: 0; }
#flash.on { animation: flash .25s ease-out; }
@keyframes flash { 0% { opacity: .28; } 100% { opacity: 0; } }
#toasts { position: fixed; left: 50%; top: calc(8px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 88; display: grid; gap: 6px; width: min(420px, calc(100% - 32px)); pointer-events: none; }
.toast { background: rgba(20, 8, 44, .95); border: 2px solid var(--purple); padding: 6px 10px; font-size: 14px; text-align: center; animation: toast 2.4s ease-out forwards; box-shadow: 0 0 0 2px #000; }
.toast.money { border-color: var(--gold); color: var(--gold); } .toast.tag { border-color: var(--cyan); color: var(--cyan); } .toast.charm { border-color: var(--r-r); } .toast.create { border-color: var(--purple); color: #e3c7ff; } .toast.level { border-color: var(--gold); }
@keyframes toast { 0% { transform: translateY(-20px); opacity: 0; } 8%, 85% { transform: none; opacity: 1; } 100% { transform: translateY(-10px); opacity: 0; } }

#app { position: relative; z-index: 1; height: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#app.shake { animation: shake .45s cubic-bezier(.36,.07,.19,.97) 1; }
@keyframes shake { 0%{transform:translate(0,0)} 20%{transform:translate(-7px,3px)} 40%{transform:translate(6px,-4px)} 60%{transform:translate(-5px,2px)} 80%{transform:translate(4px,-2px)} 100%{transform:translate(0,0)} }
.screen { display: none; flex: 1; min-height: 0; flex-direction: column; }
.screen.on { display: flex; animation: wipe .32s cubic-bezier(.2,.8,.3,1) both; }
@keyframes wipe { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }

.px { background: var(--panel); border: 2px solid var(--edge); box-shadow: 0 0 0 2px #000, inset 0 0 0 2px rgba(255,255,255,.04);
  clip-path: polygon(4px 0, calc(100% - 4px) 0, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 0 calc(100% - 4px), 0 4px); }
.btn { --c: var(--grey); --d: var(--grey-d); border: 0; background: var(--c); color: #fff; font-weight: 700; letter-spacing: .04em; font-size: 18px; min-height: 50px; padding: 6px 10px; position: relative;
  box-shadow: inset 0 -5px 0 var(--d), inset 0 2px 0 rgba(255,255,255,.35), 0 0 0 2px #000;
  clip-path: polygon(3px 0, calc(100% - 3px) 0, 100% 3px, 100% calc(100% - 3px), calc(100% - 3px) 100%, 3px 100%, 0 calc(100% - 3px), 0 3px);
  text-shadow: 2px 2px 0 rgba(0,0,0,.45); transition: transform .06s, filter .1s; }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: inset 0 -2px 0 var(--d), 0 0 0 2px #000; }
.btn:disabled { filter: grayscale(.85) brightness(.55); cursor: default; }
.btn small { display: block; font-size: 12px; font-weight: 400; opacity: .9; letter-spacing: 0; }
.b-blue { --c: #1f8fe0; --d: var(--chips-d); } .b-gold { --c: #e9a800; --d: var(--gold-d); color: #241500; text-shadow: 1px 1px 0 rgba(255,255,255,.35); }
.b-green { --c: #1fbf63; --d: var(--green-d); } .b-red { --c: #e2234b; --d: var(--mult-d); } .b-purple { --c: #8a4be6; --d: var(--purple-d); } .b-grey { --c: #4a4366; --d: #262138; }
.b-cyan { --c: #17a9b8; --d: #0b5c66; }
.mini { min-height: 34px; font-size: 13px; padding: 2px 8px; }

/* ---------- Titre ---------- */
#title { justify-content: center; align-items: center; gap: 16px; text-align: center; padding-block: 20px; overflow-y: auto; }
.logo { font-weight: 700; line-height: .9; margin: 0; font-size: clamp(54px, 19vw, 88px); letter-spacing: .02em; color: var(--ink);
  text-shadow: 4px 0 0 var(--mult), -4px 0 0 var(--chips), 0 6px 0 #000; animation: glitch 3.2s steps(1) infinite; }
.logo span { display: block; font-family: var(--f-num); font-size: 1.5em; color: var(--gold); text-shadow: 4px 4px 0 var(--mult-d), 0 0 24px rgba(255,210,63,.5); }
@keyframes glitch { 0%,92%,100%{transform:none} 93%{transform:translate(3px,-1px) skewX(-6deg)} 95%{transform:translate(-3px,1px)} 97%{transform:translate(1px,0) skewX(4deg)} }
.tagline { color: var(--dim); margin: 0; font-size: 15px; max-width: 30ch; }
.title-cards { display: flex; gap: 6px; justify-content: center; height: 96px; align-items: center; }
.title-cards .card { --cw: 58px; }
.title-cards .card:nth-child(1) { --rot: -12deg; } .title-cards .card:nth-child(3) { --rot: 10deg; }
.menu { display: grid; gap: 9px; width: min(300px, 100%); }
.record { font-family: var(--f-num); font-size: 20px; color: var(--gold); }

/* ---------- Choix du paquet ---------- */
#setup { justify-content: center; gap: 12px; padding-block: 16px; overflow-y: auto; }
#setup h2 { margin: 0; text-align: center; font-size: 24px; }
.deckpick { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 12px; }
.deckcard { display: grid; justify-items: center; gap: 8px; text-align: center; min-height: 190px; align-content: center; }
.deckart { width: 84px; height: 118px; position: relative; box-shadow: 0 0 0 2px #000, 4px 5px 0 rgba(0,0,0,.5); animation: bob 3s ease-in-out infinite; }
.deckart::before { content: ""; position: absolute; inset: 0; background: repeating-conic-gradient(from 45deg, var(--a) 0 25%, var(--b) 0 50%) 0 0 / 12px 12px; }
.deckart::after { content: ""; position: absolute; inset: 7px; border: 2px solid var(--c, #fff); }
.deckart.locked { filter: grayscale(1) brightness(.4); }
.deckname { font-size: 20px; font-weight: 700; }
.deckdesc { font-size: 14px; color: var(--dim); max-width: 30ch; min-height: 38px; }
.stakes { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; }
.stake { aspect-ratio: 1; border-radius: 50%; border: 3px dashed rgba(0,0,0,.45); background: var(--sc); box-shadow: 0 0 0 2px #000; padding: 0; }
.stake.sel { outline: 3px solid #fff; outline-offset: 2px; }
.stake:disabled { filter: grayscale(1) brightness(.35); }
.stakeinfo { text-align: center; font-size: 13px; color: var(--dim); min-height: 34px; }

/* ---------- Sélection de table ---------- */
#select { gap: 8px; padding-block: 8px; overflow-y: auto; }
.selhead { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; }
.selhead h2 { margin: 0; font-size: 22px; }
.money { font-family: var(--f-num); font-size: 32px; color: var(--gold); line-height: 1; }
.blinds { display: grid; gap: 8px; }
.blind { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px; animation: rise .4s cubic-bezier(.2,.8,.3,1) both; animation-delay: calc(var(--i) * .08s); }
@keyframes rise { from { transform: translateY(20px); opacity: 0; } }
.blind.done, .blind.skipped { opacity: .45; }
.blind.upcoming { opacity: .8; }
.blind.current { border-color: var(--gold); }
.blind.boss { border-color: var(--boss); background: rgba(45, 4, 14, .88); }
.chip { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-num); font-size: 26px; color: #fff;
  background: var(--cc, #1f8fe0); border: 5px dashed rgba(255,255,255,.7); box-shadow: 0 0 0 3px #000, inset 0 0 0 3px rgba(0,0,0,.3); text-shadow: 2px 2px 0 #000; animation: spin 8s linear infinite; }
@keyframes spin { to { rotate: 360deg; } }
.blind .bname { font-weight: 700; font-size: 17px; }
.blind .brule { font-size: 13px; color: #ffb3c0; }
.blind .binfo { font-size: 13px; color: var(--dim); }
.blind .binfo b { font-family: var(--f-num); font-size: 20px; color: var(--gold); font-weight: 400; }
.blind .bact { display: grid; gap: 6px; min-width: 104px; }
.tagpill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--cyan); }
.tagicon { width: 24px; height: 24px; display: grid; place-items: center; background: #062a33; border: 2px solid var(--cyan); }
.tagicon svg { width: 16px; height: 16px; color: var(--cyan); }
.owned-tags { display: flex; gap: 4px; flex-wrap: wrap; }

/* ---------- Jeu ---------- */
#game { gap: 5px; padding-block: 6px; }
#hdr { padding: 5px 10px; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; }
#hdr.boss { border-color: var(--boss); background: rgba(50, 4, 14, .88); }
#tName { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#hdr.boss #tName { color: #ff8095; }
#tRule { grid-column: 1 / -1; font-size: 12px; color: #ffb3c0; margin-top: -2px; }
#tGoal { font-family: var(--f-num); font-size: 22px; color: var(--gold); text-align: right; line-height: 1; }
#tGoal small { font-family: var(--f-text); font-size: 10px; color: var(--dim); display: block; }
.bar { grid-column: 1 / -1; height: 9px; background: #000; border: 2px solid #2d1f55; position: relative; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; width: 0; background: repeating-linear-gradient(90deg, var(--gold) 0 6px, #ffb000 6px 8px); transition: width .6s cubic-bezier(.2,.9,.3,1.2); }
#hdr.boss .bar i { background: repeating-linear-gradient(90deg, #ff5470 0 6px, #c4002a 6px 8px); }
#stats { display: grid; grid-template-columns: 1.6fr 1fr 1fr 1.1fr 1fr; gap: 5px; }
.stat { padding: 2px 4px 1px; text-align: center; min-width: 0; }
.stat b { display: block; font-size: 10px; color: var(--dim); font-weight: 400; letter-spacing: .06em; text-transform: uppercase; }
.stat span { font-family: var(--f-num); font-size: 24px; line-height: .95; display: block; font-variant-numeric: tabular-nums; white-space: nowrap; }
#sScore span, #sMoney span { color: var(--gold); }
.stat.bump span { animation: bump .35s; }
@keyframes bump { 40% { transform: scale(1.35); } }
#charmsRow { height: 54px; }
.slots { display: grid; grid-template-columns: repeat(var(--n, 5), 1fr); gap: 5px; height: 100%; }
.slot { position: relative; border: 2px dashed #3d2d70; background: rgba(10,4,22,.6); display: grid; place-items: center; padding: 0; min-width: 0; }
.slot.full { border: 2px solid var(--rc, var(--r-c)); background: rgba(16,6,36,.92); box-shadow: inset 0 0 12px color-mix(in srgb, var(--rc) 35%, transparent); animation: bob 3s ease-in-out infinite; animation-delay: calc(var(--i) * -.6s); }
.slot svg { width: 30px; height: 30px; }
.slot .price { position: absolute; bottom: 0; left: 0; right: 0; font-family: var(--f-num); font-size: 14px; line-height: 1; color: var(--gold); background: rgba(0,0,0,.6); }
.slot.trig { animation: wobble .38s cubic-bezier(.3,1.4,.5,1) 1; }
@keyframes wobble { 0%{transform:rotate(0) scale(1)} 30%{transform:rotate(-12deg) scale(1.22)} 60%{transform:rotate(10deg) scale(1.22)} 100%{transform:rotate(0) scale(1)} }
.slot.off::after, .slot.dead::after { content: "✕"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--mult); font-size: 30px; background: rgba(0,0,0,.55); }
.slot.dead { filter: grayscale(1); }
.slot.hiddenc svg { visibility: hidden; }
.slot.hiddenc { background: repeating-conic-gradient(from 45deg, #2a0f5c 0 25%, #4b1d9e 0 50%) 0 0 / 10px 10px; }
.stk { position: absolute; top: -2px; left: -2px; font-family: var(--f-num); font-size: 12px; line-height: 1; padding: 0 2px; background: #000; color: #fff; }
.stk.e { color: #c9c9ff; } .stk.p { color: #ffb36b; left: auto; right: -2px; } .stk.r { color: var(--gold); top: auto; bottom: -2px; }
.r-c { --rc: var(--r-c); } .r-u { --rc: var(--r-u); } .r-r { --rc: var(--r-r); } .r-l { --rc: var(--r-l); }
#consRow { display: grid; grid-template-columns: 1fr auto auto; gap: 5px; height: 38px; }
.cons { display: flex; gap: 5px; }
.cslot { width: 38px; height: 38px; border: 2px dashed #3d2d70; background: rgba(10,4,22,.6); display: grid; place-items: center; padding: 0; position: relative; }
.cslot.full { border-style: solid; }
.cslot svg { width: 24px; height: 24px; }
.cslot.k-arcane { border-color: var(--purple); background: rgba(40, 10, 70, .9); } .cslot.k-arcane svg { color: #d6a8ff; }
.cslot.k-etoile { border-color: var(--gold); background: rgba(50, 36, 6, .9); } .cslot.k-etoile svg { color: var(--gold); }
.cslot.k-spectre { border-color: var(--cyan); background: rgba(6, 40, 50, .9); } .cslot.k-spectre svg { color: var(--cyan); }
.zone { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 2px; position: relative; }
.zlabel { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--dim); padding: 0 2px; }
.zlabel .tot { font-family: var(--f-num); font-size: 24px; color: var(--ink); line-height: 1; }
.tot.bust { color: var(--mult); } .tot.bj { color: var(--gold); }
.hands { display: flex; gap: 6px; justify-content: center; }
.hand { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; padding: 3px 2px; border: 2px solid transparent; }
.hands.split .hand { --cw: calc(var(--cwb) * .74); }
.hands.split3 .hand { --cw: calc(var(--cwb) * .56); }
.hands.split .hand.active { border-color: var(--gold); background: rgba(255,210,63,.07); }
.hands.split .hand.scoring { border-color: var(--chips); }
.hand .htot { text-align: center; }
.htype { text-align: center; font-size: 11px; color: var(--cyan); height: 13px; white-space: nowrap; overflow: hidden; }
.row { display: flex; justify-content: center; align-items: flex-end; height: calc(var(--cw) * 1.4 + 10px); padding-top: 4px; }
.row > .card + .card { margin-left: var(--ov, 6px); }
.peek { position: absolute; right: 0; top: 0; display: flex; align-items: center; gap: 3px; font-size: 11px; color: var(--purple); z-index: 3; }
.peek .card { --cw: 24px; animation: none; }
.peek .card .cc, .peek .card .br, .peek .card .etag, .peek .card .seal { display: none; }
.peek .card .ci { font-size: 13px; }

/* ---------- Cartes ---------- */
.card { --i: 0; --rot: 0deg; --ty: 0px; width: var(--cw); height: calc(var(--cw) * 1.4); flex: none; position: relative; color: var(--paper-ink); font-family: var(--f-num);
  rotate: var(--rot); translate: 0 var(--ty); animation: bob 3.4s ease-in-out infinite; animation-delay: calc(var(--i) * -.55s); }
@keyframes bob { 0%,100% { translate: 0 var(--ty, 0px); } 50% { translate: 0 calc(var(--ty, 0px) - 3px); } }
.card .cface, .card .cback { position: absolute; inset: 0; background: var(--paper);
  box-shadow: 0 0 0 2px #000, inset 0 0 0 2px #fff, inset -3px -3px 0 rgba(0,0,0,.12), 3px 4px 0 rgba(0,0,0,.45);
  clip-path: polygon(3px 0, calc(100% - 3px) 0, 100% 3px, 100% calc(100% - 3px), calc(100% - 3px) 100%, 3px 100%, 0 calc(100% - 3px), 0 3px); overflow: hidden; }
.card.red { color: var(--red-suit); }
.card .ci { position: absolute; display: flex; flex-direction: column; align-items: center; line-height: .8; font-size: calc(var(--cw) * .4); z-index: 1; }
.card .ci svg { width: calc(var(--cw) * .2); height: calc(var(--cw) * .2); margin-top: 1px; }
.card .tl { left: 3px; top: 3px; } .card .br { right: 3px; bottom: 3px; transform: rotate(180deg); }
.card .cc { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: grid; place-items: center; z-index: 1; }
.card .cc svg { width: calc(var(--cw) * .5); height: calc(var(--cw) * .5); }
.card.ace .cc svg { width: calc(var(--cw) * .66); height: calc(var(--cw) * .66); }
.card.face .cface { background: linear-gradient(180deg, #fff6d8, #f1e2b8); }
.card.face .cc { gap: 1px; }
.card.face .cc svg.fig { width: calc(var(--cw) * .5); height: calc(var(--cw) * .38); color: #c08a00; }
.card.face.red .cc svg.fig { color: #c22d4a; }
.card .cc svg.mini { width: calc(var(--cw) * .26); height: calc(var(--cw) * .26); }
.card .cback { display: none; background: repeating-conic-gradient(from 45deg, #2a0f5c 0 25%, #4b1d9e 0 50%) 0 0 / 10px 10px; }
.card .cback::after { content: ""; position: absolute; inset: 5px; border: 2px solid #ff5ad9; box-shadow: inset 0 0 0 2px #2a0f5c; background: radial-gradient(circle, #ffd23f 0 3px, transparent 4px) center / 100% 100% no-repeat; }
.card.hidden .cface { display: none; } .card.hidden .cback { display: block; }
.card.fd .cface { display: none; } .card.fd .cback { display: block; }
.card.fd .cback::after { content: "?"; display: grid; place-items: center; color: var(--gold); font-size: calc(var(--cw) * .5); background: none; }
.card.dealing { animation: deal calc(.32s / var(--sp)) cubic-bezier(.2,.8,.3,1.1) both; }
@keyframes deal { from { transform: translate(90px, -160px) rotate(25deg) scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
.card.flipping { animation: flip calc(.36s / var(--sp)) ease-in-out both; }
@keyframes flip { 0% { transform: scaleX(1); } 50% { transform: scaleX(0); } 100% { transform: scaleX(1); } }
.card.leaving { animation: toss .3s ease-in forwards; }
@keyframes toss { to { transform: translate(-40px, 60px) rotate(-40deg); opacity: 0; } }
.card.lit { animation: lit .3s; z-index: 2; }
@keyframes lit { 50% { transform: translateY(-12px) scale(1.14); } }
.card.debuffed .cface::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(45deg, rgba(255,40,70,.35) 0 4px, transparent 4px 8px); z-index: 2; }
.card.shatter { animation: shatter .5s ease-in forwards; }
@keyframes shatter { 30% { transform: scale(1.1) rotate(4deg); filter: brightness(2); } 100% { transform: scale(.4) rotate(-20deg); opacity: 0; filter: brightness(3); } }
.card.dim { filter: brightness(.55) saturate(.6); }
.card.picked { outline: 3px solid var(--gold); outline-offset: 2px; transform: translateY(-8px); }
.card .etag { position: absolute; left: 50%; bottom: 2px; transform: translateX(-50%); font-family: var(--f-num); font-size: calc(var(--cw) * .24); line-height: 1; padding: 0 3px; color: #fff; background: #000; white-space: nowrap; z-index: 3; }
.card .seal { position: absolute; right: 2px; top: 2px; width: calc(var(--cw) * .2); height: calc(var(--cw) * .2); border-radius: 50%; box-shadow: 0 0 0 1px #000, inset -2px -2px 0 rgba(0,0,0,.3); z-index: 3; }
.seal.s-rouge { background: #ff2d4a; } .seal.s-or { background: #ffd23f; } .seal.s-bleu { background: #33c4ff; } .seal.s-violet { background: #b56cff; }
